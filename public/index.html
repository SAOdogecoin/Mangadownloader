<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Mangaink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d2ff30'/><text y='72' x='50' text-anchor='middle' font-size='60' fill='%230d1117'>📚</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --org:#d2ff30;--org-h:#b8e020;--org-s:rgba(210,255,48,.15);
  --ok:#16a34a;--err:#dc2626;--warn:#ca8a04;
  --fg:#0d1117;--sub:#6b7280;--border:#e5e7eb;--card:#ffffff;--bg:#ffffff;--surf:#f0f0f0;
  --blk:#0d1117;--blk-h:#1f2937;--blk-text:#fff;
  --r:8px;
}
/* ─── DARK MODE ─── */
[data-theme="dark"]{--bg:#111827;--card:#1f2937;--fg:#f0f0f0;--sub:#9ca3af;--border:#374151;--surf:#374151;--blk:#d2ff30;--blk-h:#b8e020;--blk-text:#0d1117;}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--fg:#f0f0f0;--sub:#9ca3af;--border:#374151;--surf:#374151;--blk:#d2ff30;--blk-h:#b8e020;--blk-text:#0d1117;}}
html,body{height:100%;height:-webkit-fill-available;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;letter-spacing:-.005em}
/* Subtle film grain over background for depth */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.app-body,.topbar{position:relative;z-index:1}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--org);border-radius:9px;opacity:.5}
-webkit-tap-highlight-color:transparent;

/* ─── TOPBAR ─── */
.topbar{background:var(--bg);flex-shrink:0;border-bottom:1.5px solid var(--border);position:relative}
.topbar-r1{padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between}
.app-title{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--fg);letter-spacing:-.04em;font-variation-settings:'opsz' 144,'SOFT' 50;line-height:1;display:inline-flex;align-items:baseline;gap:0}
.app-title em{color:var(--org);font-style:italic;font-weight:500;font-variation-settings:'opsz' 144,'SOFT' 100}
.ttab-group{display:flex;align-items:center;gap:2px}
.ttab-icon{width:44px;height:44px;border:none;background:none;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative}
.ttab-icon.active{color:var(--org)}
.ttab-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.lib-badge{position:absolute;top:4px;right:4px;min-width:14px;height:14px;background:var(--org);color:#fff;font-size:8px;font-weight:800;border-radius:99px;padding:0 3px;line-height:14px;text-align:center;display:none;pointer-events:none}
.topbar-r2{padding:0 12px 11px;display:flex;align-items:center;gap:8px}
.r2-search{display:flex;align-items:center;gap:8px;flex:1}
.r2-library{display:none;align-items:center;gap:8px;flex:1}
.search-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;color:var(--fg);padding:9px 36px 9px 16px;outline:none;transition:border-color .2s,background .2s;min-width:0;letter-spacing:-.005em}
.search-input:hover{border-color:rgba(210,255,48,.4)}
.search-input:focus{border-color:var(--org);background:var(--bg)}
.search-input::placeholder{color:#a8a29e}
.btn-clear-input{position:absolute;right:8px;width:22px;height:22px;border:none;background:none;cursor:pointer;color:#aaa;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:color .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn-clear-input:hover{color:var(--fg)}
.btn-clear-input svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}
.btn-src-toggle{flex-shrink:0;border:1.5px solid var(--border);background:none;border-radius:99px;font-family:inherit;font-size:11px;font-weight:800;color:var(--sub);padding:5px 10px;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;letter-spacing:.02em}
.btn-src-toggle.alt-active{border-color:var(--org);color:var(--org);background:color-mix(in srgb,var(--org) 12%,transparent)}
.alt-source-badge{font-size:9px;font-weight:800;background:var(--org);color:#0d1117;border-radius:4px;padding:1px 4px;margin-left:4px;letter-spacing:.04em;vertical-align:middle}
.btn-load-more{padding:10px 28px;background:var(--bg);border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-load-more:hover{border-color:var(--blk);background:var(--blk);color:#fff}
.btn-load-more:disabled{opacity:.45;cursor:default}
.btn-search{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:600;letter-spacing:-.005em;cursor:pointer;transition:transform .15s,box-shadow .25s;white-space:nowrap;min-height:36px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 6px 16px -6px rgba(210,255,48,.5)}
.btn-search:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(210,255,48,.7)}
.btn-search:active{transform:translateY(0)}
.btn-search:hover{background:var(--blk-h)}
.btn-search:active{background:var(--blk-h);transform:scale(.96)}
.btn-search svg{width:13px;height:13px;stroke:var(--blk-text);fill:none}

/* ─── LAYOUT ─── */
.app-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.view{display:none;flex:1;overflow-y:auto;flex-direction:column;min-height:0}
.view.active{display:flex}

/* ─── SEARCH VIEW ─── */
.search-hint{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;font-weight:600}
.search-loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--sub);font-size:14px;font-weight:600}
.spin{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--org);border-radius:50%;animation:rspin .7s linear infinite;flex-shrink:0}
@keyframes rspin{to{transform:rotate(360deg)}}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px}
.result-card{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s}
.result-card:active{transform:scale(.97)}
.result-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surf)}
.result-cover{width:100%;height:100%;object-fit:cover;display:block}
.result-cover-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.result-cover-ph svg{width:32px;height:32px;stroke:#c8bdb8;fill:none}
.status-pill{position:absolute;bottom:6px;left:6px;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.pill-ongoing{background:rgba(22,163,74,.9);color:#fff}
.pill-completed{background:rgba(37,99,235,.9);color:#fff}
.pill-hiatus{background:rgba(217,119,6,.9);color:#fff}
.pill-cancelled{background:rgba(220,38,38,.9);color:#fff}
.result-title{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--fg);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.result-meta{font-size:10px;color:var(--sub);margin-top:3px}

/* ─── HOME / LIBRARY / DISCOVERY ─── */

/* Topbar library button */
.topbar-lib-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:none;border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.topbar-lib-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.topbar-lib-btn.active{border-color:var(--org);color:var(--org);background:var(--org-s)}
.topbar-lib-btn:hover{border-color:var(--blk);color:var(--blk)}

/* Library page */
.lib-page-hdr{padding:20px 16px 0;flex-shrink:0}
.lib-page-title{font-size:20px;font-weight:800;color:var(--fg);font-family:'Space Grotesk',sans-serif}
.lib-empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;font-weight:600;line-height:1.6}

/* Unified section wrapper */
.home-section{padding:24px 16px 4px;flex-shrink:0;position:relative}
.home-section:first-child{padding-top:20px}
.home-section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);gap:12px}
.home-section-kicker{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;color:var(--sub);letter-spacing:.18em;text-transform:uppercase;line-height:1;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.home-section-kicker::before{content:'';width:14px;height:1.5px;background:var(--org);display:inline-block}
.home-section-label{font-family:'Fraunces',serif;font-size:24px;font-weight:500;color:var(--fg);letter-spacing:-.025em;line-height:1;font-variation-settings:'opsz' 100,'SOFT' 30}
.home-section-label em{color:var(--org);font-style:italic;font-weight:400}
.home-section-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:.06em;white-space:nowrap;padding-bottom:3px}

/* Unified manga card — used everywhere on home */
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;padding-bottom:4px}
.mc-card{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s}
.mc-card:active{transform:scale(.96)}
.mc-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surf);flex-shrink:0}
.mc-cover{width:100%;height:100%;object-fit:cover;display:block}
.mc-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.mc-ph svg{width:24px;height:24px;stroke:#c8bdb8;fill:none}
.mc-ch-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.72);color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:3px;white-space:nowrap}
.mc-title{margin-top:5px;font-size:11px;font-weight:700;color:var(--fg);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc-sub{font-size:9.5px;color:var(--fg);font-weight:700;margin-top:1px}

/* Discovery horizontal strip */
.disc-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;scroll-padding:16px;scroll-snap-type:x proximity}
.disc-strip::-webkit-scrollbar{display:none}
.disc-card{flex-shrink:0;width:108px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .25s cubic-bezier(.2,.8,.2,1);scroll-snap-align:start;position:relative}
.disc-card:hover{transform:translateY(-3px)}
.disc-card:active{transform:scale(.97)}
.disc-cover-wrap{position:relative;width:108px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;background:var(--surf);box-shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.5);transition:box-shadow .25s}
.disc-card:hover .disc-cover-wrap{box-shadow:0 1px 0 rgba(0,0,0,.4),0 14px 28px -10px rgba(0,0,0,.6),0 0 0 1px rgba(210,255,48,.25)}
.disc-cover-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none;opacity:0;transition:opacity .25s}
.disc-card:hover .disc-cover-wrap::after{opacity:1}
.disc-cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.disc-card:hover .disc-cover{transform:scale(1.04)}
.disc-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--surf),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center}
.disc-ph svg{width:22px;height:22px;stroke:var(--sub);fill:none;opacity:.5}
.disc-rating-row{display:flex;align-items:center;gap:2px;margin-top:4px}
.disc-rating-row .star{font-size:9px}
.disc-rating-num{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:.02em}
.disc-title{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--fg);line-height:1.32;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-.005em}
/* Lead card variant — first card in each section is featured */
.disc-card.lead{width:148px}
.disc-card.lead .disc-cover-wrap{width:148px;border-radius:4px}
.disc-card.lead .disc-title{font-size:13px;margin-top:10px;-webkit-line-clamp:2}
/* Fade-in stagger on first paint */
@keyframes discIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.home-section{animation:discIn .55s cubic-bezier(.2,.8,.2,1) both}
.home-section:nth-child(1){animation-delay:.02s}
.home-section:nth-child(2){animation-delay:.08s}
.home-section:nth-child(3){animation-delay:.14s}
.home-section:nth-child(4){animation-delay:.20s}
.home-section:nth-child(5){animation-delay:.26s}
.disc-loading{padding:20px;text-align:center;color:var(--sub);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}

/* ─── LIBRARY VIEW (legacy — unused but kept for safety) ─── */
.lib-grid-section{padding:14px 16px;flex:1}
.lib-search{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;color:var(--fg);padding:7px 14px;outline:none;transition:all .15s;min-width:0}
.lib-search:focus{border-color:var(--org);box-shadow:0 0 0 3px var(--org-s)}
.lib-search::placeholder{color:#a8a29e}
.manga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.manga-card{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.manga-card-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:var(--surf);transition:transform .18s,box-shadow .18s}
.manga-card:active .manga-card-cover-wrap{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.manga-card-cover{width:100%;height:100%;object-fit:cover;display:block}
.manga-card-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.manga-card-ph svg{width:28px;height:28px;stroke:#c8bdb8;fill:none}
.ch-badge{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.75);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px}
.del-btn{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:2;-webkit-tap-highlight-color:transparent}
.del-btn svg{width:10px;height:10px;stroke:#fff;fill:none}
@media(hover:hover){.manga-card:hover .del-btn{opacity:1}}
@media(hover:none){.del-btn{opacity:.8}}
.manga-card-title{margin-top:6px;font-size:11px;font-weight:700;color:var(--fg);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 40px;text-align:center}
.empty-state .ekao{font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--org);letter-spacing:-.02em;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.empty-state .etitle{font-family:'Fraunces',serif;font-size:32px;font-weight:500;color:var(--fg);letter-spacing:-.035em;line-height:1.05;max-width:340px;font-variation-settings:'opsz' 144,'SOFT' 30}
.empty-state .etitle em{color:var(--org);font-style:italic;font-weight:400}
.empty-state .esub{font-family:'Inter',sans-serif;font-size:13px;color:var(--sub);max-width:300px;line-height:1.55;font-weight:400}
.empty-state .ekicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.empty-state .ekicker::before,.empty-state .ekicker::after{content:'';width:18px;height:1px;background:var(--border)}
.empty-state .ebtn{margin-top:6px;background:var(--org);color:#0d1117;border:none;border-radius:99px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:-.01em;padding:11px 24px;cursor:pointer;transition:transform .15s,box-shadow .25s;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 20px -6px rgba(210,255,48,.4)}
.empty-state .ebtn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -6px rgba(210,255,48,.55)}
.empty-state .ebtn:active{transform:translateY(0)}
.empty-icon svg{width:44px;height:44px;stroke:#d6d3d1;fill:none}
.empty-title{font-size:15px;font-weight:700;color:var(--fg)}
.empty-sub{font-size:13px;color:var(--sub);max-width:260px;line-height:1.5}

/* ─── MANGA DETAIL PANEL ─── */
.panel-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.panel-bg.open{display:block}
.panel{position:fixed;bottom:0;left:0;right:0;height:85vh;background:var(--card);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.panel.open{transform:translateY(0)}
.panel-hdr{display:flex;align-items:flex-start;gap:14px;padding:16px 16px 12px;flex-shrink:0}
.panel-drag{width:36px;height:4px;background:#e0dcd8;border-radius:99px;margin:0 auto 12px;flex-shrink:0}
.panel-cover{width:80px;height:120px;border-radius:5px;object-fit:cover;background:var(--surf);flex-shrink:0}
.panel-cover-ph{width:80px;height:120px;border-radius:5px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.panel-cover-ph svg{width:30px;height:30px;stroke:#c8bdb8;fill:none}
.panel-info{flex:1;min-width:0;padding-top:2px}
.panel-title{font-size:15px;font-weight:800;color:var(--fg);line-height:1.3;margin-bottom:5px}
.panel-meta{font-size:11px;color:var(--sub);margin-bottom:8px}
.panel-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag-pill{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:10px;color:var(--sub);font-weight:600}
button.tag-pill{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s}
button.tag-pill:hover{border-color:var(--org);color:var(--org);background:var(--org-s)}
button.status-pill{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
button.status-pill:hover{opacity:.75}
.panel-desc{font-size:12px;color:var(--sub);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel-desc.expanded{display:block;-webkit-line-clamp:unset}
.btn-more-desc{display:inline;background:none;border:none;font-family:inherit;font-size:11px;color:var(--org);font-weight:700;cursor:pointer;padding:0 0 0 3px;-webkit-tap-highlight-color:transparent}
.panel-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);-webkit-tap-highlight-color:transparent;z-index:1}
.panel-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.panel-save-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--org);color:#0d1117;border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.panel-save-btn:hover{background:var(--org-h)}
.panel-save-btn.saved{background:var(--org);color:#0d1117}
.panel-save-btn svg{width:12px;height:12px;stroke:#0d1117;fill:none}
.panel-body{flex:1;overflow-y:auto;min-height:0}
.ch-section-hdr{padding:12px 16px 6px;font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--border)}
.ch-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent}
.ch-row:last-child{border-bottom:none}
.ch-row.current-ch{background:var(--org-s)}
.ch-row-info{flex:1;min-width:0}
.ch-num{font-size:13px;font-weight:700;color:var(--fg)}
.ch-row.current-ch .ch-num{color:var(--org)}
.ch-title{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-pages{font-size:10px;color:#a8a29e;margin-top:2px}
.ch-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-read{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s;min-height:36px;white-space:nowrap}
.btn-read:hover{background:var(--blk-h)}
.btn-read svg{width:11px;height:11px;stroke:var(--blk-text);fill:var(--blk-text);flex-shrink:0}
.btn-dl-ch{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;height:36px;border:1.5px solid var(--border);border-radius:99px;background:var(--card);cursor:pointer;font-family:inherit;font-size:11px;font-weight:800;color:var(--fg);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:all .15s;white-space:nowrap;letter-spacing:.02em}
.btn-dl-ch:hover{border-color:var(--blk);background:var(--blk);color:#fff}
.btn-dl-ch:hover svg{stroke:#fff}
.btn-dl-ch svg{width:13px;height:13px;stroke:currentColor;fill:none;flex-shrink:0}
.btn-dl-ch.dl-loading svg{animation:rspin .7s linear infinite}
.panel-loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--sub);font-size:14px;font-weight:600}

/* ─── READER ─── */
.reader-overlay{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.reader-overlay.hidden{display:none}
.reader-top{height:50px;background:rgba(0,0,0,.85);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;position:absolute;top:0;left:0;right:0;z-index:2;transition:opacity .2s}
.reader-top.hide{opacity:0;pointer-events:none}
.reader-back{display:flex;align-items:center;gap:4px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;padding:6px 10px;border-radius:99px;transition:background .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.reader-back:hover{background:rgba(255,255,255,.1)}
.reader-back svg{width:14px;height:14px;stroke:#fff;fill:none}
.reader-meta{flex:1;min-width:0;text-align:center}
.reader-title-txt{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-ch-txt{font-size:10px;color:rgba(255,255,255,.6)}
.reader-loc-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.reader-loc-btn:active{background:rgba(255,255,255,.25)}

/* Reader area */
.reader-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer}
.reader-img-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.reader-img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.reader-page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.6);font-size:14px;font-weight:600}
.reader-spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--org);border-radius:50%;animation:rspin .75s linear infinite}
.reader-error{color:rgba(255,255,255,.5);text-align:center;padding:20px;font-size:13px}

/* Progress bar */
.reader-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:2}
.reader-progress-fill{height:100%;background:var(--org);transition:width .2s}

/* Touch zones (invisible) */
.tap-zone{position:absolute;top:50px;bottom:3px;width:30%;z-index:3}
.tap-left{left:0}
.tap-right{right:0}
.tap-center{left:30%;right:30%;cursor:default}

/* Next chapter button */
.next-ch-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 22px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:4;display:none;box-shadow:0 4px 16px rgba(244,98,42,.5)}
.next-ch-btn:hover{background:var(--org-h)}

/* ─── TOC PANEL ─── */
.toc-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110;display:none}
.toc-bg.open{display:block}
.toc-panel{position:fixed;bottom:0;left:0;right:0;max-height:72vh;background:var(--card);border-radius:18px 18px 0 0;z-index:111;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.toc-panel.open{transform:translateY(0)}
.toc-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.toc-title-label{font-size:13px;font-weight:800;color:var(--fg)}
.toc-close{background:none;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);-webkit-tap-highlight-color:transparent}
.toc-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.toc-list{flex:1;overflow-y:auto;padding:6px 0}
.toc-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s}
.toc-item:active{background:var(--bg)}
.toc-item.cur{background:var(--org-s)}
.toc-num{font-size:10px;font-weight:700;color:var(--sub);min-width:36px;flex-shrink:0}
.toc-name{font-size:13px;color:var(--fg);flex:1}
.toc-pages{font-size:10px;color:var(--sub);flex-shrink:0}
.toc-item.cur .toc-num,.toc-item.cur .toc-name{color:var(--org);font-weight:700}

/* ─── FAB ─── */
.fab{display:none;position:fixed;bottom:22px;right:18px;width:54px;height:54px;border-radius:50%;background:var(--blk);border:none;color:var(--org);cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:30;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s,box-shadow .15s}
.fab svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:99px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── MOBILE ─── */
@media(max-width:700px){
  .results-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:12px}
  .manga-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
  .fab{display:flex}
}

/* ─── SEARCH DROPDOWN ─── */
.search-dropdown{position:fixed;top:108px;left:8px;right:8px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.15);display:none;overflow:hidden;max-height:70vh;overflow-y:auto}
.search-dropdown.open{display:block}
.sdrop-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent;transition:background .1s;touch-action:manipulation}
.sdrop-item:last-child{border-bottom:none}
.sdrop-item:hover,.sdrop-item:active{background:var(--bg)}
.sdrop-cover{width:34px;height:50px;border-radius:3px;object-fit:cover;flex-shrink:0;background:#e8e8e8}
.sdrop-cover-ph{width:34px;height:50px;border-radius:3px;flex-shrink:0;background:var(--org-s);display:flex;align-items:center;justify-content:center}
.sdrop-cover-ph svg{width:13px;height:13px;stroke:#aaa;fill:none}
.sdrop-info{flex:1;min-width:0}
.sdrop-title{font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdrop-meta{font-size:10px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:5px}
.sdrop-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.sdrop-loading{display:flex;justify-content:center;padding:18px}
.sdrop-empty{text-align:center;padding:18px;font-size:13px;color:var(--sub);font-weight:600}

/* ─── PREDICTIVE SEARCH RESULT DESCRIPTION ─── */
.result-desc{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ─── STAR RATING ─── */
.star-row{display:flex;align-items:center;gap:3px;margin-top:4px}
.stars{display:flex;align-items:center;gap:1px;line-height:1}
.star{font-size:10px;color:#d4d0cc}
.star.on{color:#f59e0b}
.star.half{position:relative;color:#d4d0cc}
.star.half::before{content:'★';position:absolute;left:0;width:50%;overflow:hidden;color:#f59e0b}
.star-num{font-size:10px;font-weight:700;color:var(--sub);margin-left:2px}
/* panel rating — slightly bigger */
.panel-rating{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.panel-rating .stars .star{font-size:13px}
.panel-rating .star-num{font-size:12px;font-weight:700;color:var(--sub)}
/* dropdown rating */
.sdrop-rating{display:flex;align-items:center;gap:2px;margin-top:2px}
.sdrop-rating .star{font-size:9px}
.sdrop-rating .star-num{font-size:9px;font-weight:700;color:var(--sub);margin-left:1px}

/* ─── CHAPTER ACTIONS BAR ─── */
.ch-actions-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--border);flex-shrink:0}
.btn-select-all-icon{display:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;color:var(--sub);align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:all .15s;flex-shrink:0}
.btn-select-all-icon.visible{display:flex}
.btn-select-all-icon:hover{border-color:var(--fg);color:var(--fg)}
.btn-select-all-icon.all-checked{border-color:var(--org);background:var(--org);color:#0d1117}
.btn-select-all-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.ch-count-label{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.05em;text-transform:uppercase}
.btn-toggle-select{background:none;border:1.5px solid var(--border);border-radius:99px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:all .15s}
.btn-toggle-select.active{border-color:var(--org);color:var(--org);background:var(--org-s)}

/* ─── CHAPTER CHECKBOX ─── */
.ch-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:none;align-items:center;justify-content:center;transition:all .15s;background:var(--card);cursor:pointer}
.ch-checkbox.visible{display:flex}
.ch-checkbox.checked{background:var(--org);border-color:var(--org)}
.ch-checkbox svg{display:none;width:11px;height:11px;stroke:#0d1117;fill:none;stroke-width:3}
.ch-checkbox.checked svg{display:block}
.ch-row{cursor:pointer}
.ch-row:active{background:#f5f4f2}

/* ─── NAV TABS ─── */
.topbar-r3{display:none}
.nav-tabs-row{display:flex;gap:18px;align-items:center}
.nav-pill{border:none;background:none;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--fg);cursor:pointer;padding:6px 0;-webkit-tap-highlight-color:transparent;transition:color .2s,letter-spacing .2s;white-space:nowrap;line-height:1;letter-spacing:-.005em;position:relative;opacity:.72}
.nav-pill:hover{color:var(--org);opacity:1}
.nav-pill.active{color:var(--fg);opacity:1;font-weight:600}
.nav-pill.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--org);box-shadow:0 0 8px rgba(210,255,48,.6)}

/* ─── GENRE PAGE ─── */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:16px}
.genre-card{padding:14px 10px;border:1.5px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg);background:var(--card);-webkit-tap-highlight-color:transparent;transition:all .15s;font-family:inherit}
.genre-card:hover{border-color:var(--org);color:var(--org);background:var(--org-s)}
.genre-card:active{transform:scale(.96)}

/* ─── THEME TOGGLE ─── (removed) ─── */

/* ─── PANEL ACTION ROW ─── */
.panel-action-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.panel-dl-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--org);color:#0d1117;border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.panel-dl-btn:hover{background:var(--org-h)}
.panel-dl-btn.active{background:var(--surf);color:var(--fg)}
.panel-dl-btn svg{width:12px;height:12px;stroke:currentColor;fill:none}

/* ─── FORMAT TOGGLE ─── */
.fmt-toggle{display:flex;background:var(--surf);border-radius:8px;overflow:hidden;flex-shrink:0;padding:2px;gap:2px}
.fmt-btn{background:none;border:none;padding:5px 9px;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;border-radius:6px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.fmt-btn.active{background:var(--org);color:#0d1117}
.fmt-kindle{font-size:8px;font-weight:800;background:rgba(0,0,0,.15);border-radius:3px;padding:1px 4px;letter-spacing:.03em}

/* ─── PANEL SELECT ACTION BAR ─── */
.panel-select-bar{padding:10px 12px;border-top:1px solid var(--border);display:none;align-items:center;gap:8px;flex-shrink:0;background:var(--card);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.panel-select-bar.show{display:flex}
.btn-dl-selected{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;white-space:nowrap}
.btn-dl-selected svg{width:14px;height:14px;stroke:var(--blk-text);fill:none;flex-shrink:0}
.btn-dl-selected:disabled{opacity:.45;cursor:default}
.btn-dl-selected:not(:disabled):hover{background:var(--blk-h)}
</style>
</head>

<div class="topbar">

    <span class="app-title" onclick="navigate('home')" style="cursor:pointer">Manga<em>ink</em></span>

<!-- Manga Detail Panel -->

// ═══════════════════════════════════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════════════════════════════════
const IDB = {
  db: null,
  async init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('manga-dl', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('manga')) db.createObjectStore('manga', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
      };
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _s(s, m) { return this.db.transaction(s, m).objectStore(s); },
  save(b) { return new Promise((res, rej) => { const r = this._s('manga', 'readwrite').put(b); r.onsuccess = res; r.onerror = e => rej(e.target.error); }); },
  getAll() { return new Promise((res, rej) => { const r = this._s('manga', 'readonly').getAll(); r.onsuccess = e => res(e.target.result || []); r.onerror = e => rej(e.target.error); }); },
  get(id) { return new Promise((res, rej) => { const r = this._s('manga', 'readonly').get(id); r.onsuccess = e => res(e.target.result || null); r.onerror = e => rej(e.target.error); }); },
  del(id) { return new Promise((res, rej) => { const r = this._s('manga', 'readwrite').delete(id); r.onsuccess = res; r.onerror = e => rej(e.target.error); }); },
};

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function proxyUrl(url, referer) {
  let u = `/api/proxy?url=${encodeURIComponent(url)}`;
  if (referer) u += `&referer=${encodeURIComponent(referer)}`;
  return u;
}
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), dur);
}
function isMob() { return window.innerWidth <= 700; }
function statusPillClass(s) {
  return { ongoing: 'pill-ongoing', completed: 'pill-completed', hiatus: 'pill-hiatus', cancelled: 'pill-cancelled' }[s] || 'pill-ongoing';
}

// rating: 0–10 bayesian score → 5 stars
function starsHtml(rating, cls = '') {
  if (!rating) return '';
  const out5 = rating / 2; // convert to 5-star
  let html = '<span class="stars' + (cls ? ' ' + cls : '') + '">';
  for (let i = 1; i <= 5; i++) {
    if (out5 >= i) html += '<span class="star on">★</span>';
    else if (out5 >= i - 0.5) html += '<span class="star half">★</span>';
    else html += '<span class="star">★</span>';
  }
  html += '</span>';
  return html;
}
function ratingRowHtml(rating, wrapCls = 'star-row') {
  if (!rating) return '';
  return `<div class="${wrapCls}">${starsHtml(rating)}<span class="star-num">${rating.toFixed(1)}</span></div>`;
}

// Manga data cache — populated by prefetch + openPanel
const _mangaCache = {};

// Fire-and-forget prefetch on hover/touch. Caches the manga data so click is instant.
function prefetchManga(id, source) {
  const key = (source || 'mdex') + ':' + id;
  if (_mangaCache[key]) return;
  _mangaCache[key] = 'pending';
  const url = source === 'alt'
    ? `/api/sw-manga?id=${encodeURIComponent(id)}`
    : `/api/manga?id=${id}`;
  fetch(url).then(r => r.json()).then(data => {
    if (!data.error) _mangaCache[key] = data;
    else delete _mangaCache[key];
    // Also warm chapter covers
    if (data?.manga?.coverUrl) {
      const img = new Image();
      img.src = proxyUrl(data.manga.coverUrl, data.manga.coverReferer);
    }
  }).catch(() => { delete _mangaCache[key]; });
}

async function openPanel(id, source) {
  source = source || 'mdex';
  _panelSource = source;
  currentMangaData = null;
  selectMode = false; selectedChIds.clear();
  document.getElementById('panel-bg').classList.add('open');
  document.getElementById('panel').classList.add('open');

  const preview = _previewCache[id];
  if (preview) {
    const pillCls = statusPillClass(preview.status);
    const covHtml = preview.coverUrl
      ? `<img class="panel-cover" src="${esc(proxyUrl(preview.coverUrl, preview.coverReferer))}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="panel-cover-ph" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`
      : `<div class="panel-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;
    const tagsHtml = (preview.tags || []).slice(0,4).map(t => `<span class="tag-pill">${esc(t.name || t)}</span>`).join('');
    document.getElementById('panel-hdr').innerHTML = `
      ${covHtml}
      <div class="panel-info">
        <div class="panel-title">${esc(preview.title)}</div>
        <div class="panel-meta"><span class="status-pill ${pillCls}" style="position:static;display:inline-block;margin-bottom:4px">${esc(preview.status)}</span>${preview.year ? ' · ' + preview.year : ''}</div>
        ${preview.rating ? `<div class="panel-rating">${starsHtml(preview.rating)}<span class="star-num">${preview.rating.toFixed(1)}/10</span></div>` : ''}
        <div class="panel-tags">${tagsHtml}</div>
        ${preview.description ? `<div class="panel-desc">${esc(preview.description)}</div>` : ''}
      </div>`;
    document.getElementById('panel-body').innerHTML = '<div class="panel-loading"><div class="spin"></div> Loading chapters…</div>';
  } else {
    document.getElementById('panel-hdr').innerHTML = '<div class="panel-loading"><div class="spin"></div> Loading…</div>';
    document.getElementById('panel-body').innerHTML = '';
  }

  try {
    const cacheKey = source + ':' + id;
    let data;
    // Use cached prefetch if available and complete
    if (_mangaCache[cacheKey] && _mangaCache[cacheKey] !== 'pending') {
      data = _mangaCache[cacheKey];
    } else {
      const apiUrl = source === 'alt'
        ? `/api/sw-manga?id=${encodeURIComponent(id)}`
        : `/api/manga?id=${id}`;
      data = await fetch(apiUrl).then(r => r.json());
      if (!data.error) _mangaCache[cacheKey] = data;
    }
    if (data.error) throw new Error(data.error);
    currentMangaData = data;
    renderPanel(data);
  } catch (e) {
    document.getElementById('panel-hdr').innerHTML = `<div style="padding:20px;color:var(--err);font-weight:700">Error: ${esc(e.message)}</div>`;
  }
}

function positionDropdown() {
  const tb = document.querySelector('.topbar');
  const dd = document.getElementById('search-dropdown');
  if (tb && dd) dd.style.top = (tb.getBoundingClientRect().bottom + 4) + 'px';
}

function renderDropdownItems(results) {
  const dd = document.getElementById('search-dropdown');
  positionDropdown();
  if (!results.length) { dd.innerHTML = '<div class="sdrop-empty">No results</div>'; dd.classList.add('open'); return; }
  const snapSrc = _searchSource; // capture at render time
  results.forEach(r => { _previewCache[r.id] = r; });
  dd.innerHTML = results.map(r => {
    const pillCls = statusPillClass(r.status);
    const covSrc = r.coverUrl ? proxyUrl(r.coverUrl, r.coverReferer) : null;
    const img = covSrc
      ? `<img class="sdrop-cover" src="${esc(covSrc)}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="sdrop-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;
    return `<div class="sdrop-item" onmouseenter="prefetchManga('${esc(r.id)}','${snapSrc}')" ontouchstart="prefetchManga('${esc(r.id)}','${snapSrc}')" onclick="openPanelFromDropdown('${esc(r.id)}','${snapSrc}')">
      ${img}
      <div class="sdrop-info">
        <div class="sdrop-title">${esc(r.title)}</div>
        <div class="sdrop-meta"><button class="sdrop-pill ${pillCls}" style="border:none;cursor:pointer;font-family:inherit" onclick="event.stopPropagation();closeDropdown();selectStatusSearch('${esc(r.status)}')">${esc(r.status)}</button>${r.year ? ' · ' + r.year : ''}${r.lastChapter ? ` · <span style="color:var(--org);font-weight:700">Ch.${esc(r.lastChapter)}</span>` : ''}</div>
        ${r.rating ? `<div class="sdrop-rating">${starsHtml(r.rating)}<span class="star-num">${r.rating.toFixed(1)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
  dd.classList.add('open');
}

async function doPredict() {
  const q = document.getElementById('search-input').value.trim();
  if (!q.length) { closeDropdown(); return; }
  const dd = document.getElementById('search-dropdown');

  // Instant cache hit — exact match (keyed by source too)
  const cacheKey = _searchSource + '|' + q + '|' + activeTagId;
  if (_dropCache[cacheKey]) { renderDropdownItems(_dropCache[cacheKey]); return; }

  // Partial cache — prefix match (same source only)
  let showed = false;
  for (const key of Object.keys(_dropCache)) {
    const [src, cachedQ] = key.split('|');
    if (src === _searchSource && q.startsWith(cachedQ) && _dropCache[key].length) {
      const filtered = _dropCache[key].filter(r => r.title.toLowerCase().includes(q.toLowerCase()));
      if (filtered.length) { renderDropdownItems(filtered); showed = true; break; }
    }
  }
  if (!showed) {
    dd.innerHTML = '<div class="sdrop-loading"><div class="spin" style="width:18px;height:18px;border-width:2px"></div></div>';
    positionDropdown();
    dd.classList.add('open');
  }

  // Cancel previous in-flight, fetch fresh
  if (_predictCtrl) _predictCtrl.abort();
  _predictCtrl = new AbortController();
  const signal = _predictCtrl.signal;
  try {
    let url;
    if (_searchSource === 'alt') {
      url = `/api/sw-search?q=${encodeURIComponent(q)}`;
    } else {
      url = `/api/search?q=${encodeURIComponent(q)}&limit=8`;
      if (activeTagId) url += `&tagId=${activeTagId}`;
    }
    const resp = await fetch(url, { signal });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    _dropCache[cacheKey] = results;
    renderDropdownItems(results);
  } catch (e) {
    if (e.name === 'AbortError') return;
    dd.innerHTML = `<div class="sdrop-empty">Error: ${esc(e.message)}</div>`;
  }
}

async function doSearch() {
  document.getElementById('search-input').blur();
  closeDropdown();
  const q = document.getElementById('search-input').value.trim();
  if (!q && !activeTagId && !activeStatus) return;
  lastQuery = q;
  lastTagId = activeTagId;
  lastStatus = activeStatus;
  lastOffset = 0;
  navigate('search');
  document.getElementById('search-loading').style.display = 'flex';
  document.getElementById('results-grid').innerHTML = '';
  document.getElementById('load-more-wrap').style.display = 'none';
  try {
    const url = _searchSource === 'alt'
      ? `/api/sw-search?q=${encodeURIComponent(q)}`
      : `/api/search?limit=${SEARCH_LIMIT}&offset=0&q=${encodeURIComponent(q)}${activeTagId ? '&tagId=' + activeTagId : ''}${activeStatus ? '&status=' + activeStatus : ''}`;
    const data = await fetch(url).then(r => r.json());
    if (data.error) throw new Error(data.error);
    renderResults(data.results || [], false);
  } catch (e) {
    showToast('Search failed: ' + e.message);
  } finally {
    document.getElementById('search-loading').style.display = 'none';
  }
}

async function loadMore() {
  if (!lastQuery && !lastTagId) return;
  const btn = document.getElementById('btn-load-more');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  const nextOffset = lastOffset + SEARCH_LIMIT;
  try {
    let url = `/api/search?limit=${SEARCH_LIMIT}&offset=${nextOffset}`;
    if (lastQuery) url += `&q=${encodeURIComponent(lastQuery)}`;
    if (lastTagId) url += `&tagId=${lastTagId}`;
    if (lastStatus) url += `&status=${lastStatus}`;
    const data = await fetch(url).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    if (results.length) {
      lastOffset = nextOffset;
      renderResults(results, true);
    } else {
      document.getElementById('load-more-wrap').style.display = 'none';
    }
  } catch (e) {
    showToast('Load more failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Load more';
  }
}

function resultCardHtml(r) {
  const pillCls = statusPillClass(r.status);
  const imgHtml = r.coverUrl
    ? `<img class="result-cover" src="${esc(proxyUrl(r.coverUrl))}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=result-cover-ph><svg viewBox=\\'0 0 24 24\\'><path d=\\'M4 19.5A2.5 2.5 0 0 1 6.5 17H20\\'/><path d=\\'M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\\'/></svg></div>'">`
    : `<div class="result-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;
  _previewCache[r.id] = r;
  const tagBtns = (r.tags || []).slice(0, 2).map(t =>
    `<button class="tag-pill" onclick="event.stopPropagation();selectGenreAndSearch('${esc(t.id)}')">${esc(t.name)}</button>`
  ).join('');
  return `<div class="result-card" onmouseenter="prefetchManga('${esc(r.id)}','${_searchSource}')" ontouchstart="prefetchManga('${esc(r.id)}','${_searchSource}')" onclick="openPanel('${esc(r.id)}','${_searchSource}')">
    <div class="result-cover-wrap">
      ${imgHtml}
      <button class="status-pill ${pillCls}" onclick="event.stopPropagation();selectStatusSearch('${esc(r.status)}')">${esc(r.status)}</button>
    </div>
    <div class="result-title">${esc(r.title)}</div>
    ${r.year ? `<div class="result-meta">${r.year}</div>` : ''}
    <div class="panel-tags" style="margin-top:4px;margin-bottom:0">${tagBtns}</div>
    ${ratingRowHtml(r.rating)}
    ${r.lastChapter ? `<div class="result-meta" style="color:var(--org);font-weight:700;margin-top:2px">Ch.${esc(r.lastChapter)}</div>` : ''}
  </div>`;
}

function renderResults(results, append = false) {
  const grid = document.getElementById('results-grid');
  const lmw = document.getElementById('load-more-wrap');
  const btn = document.getElementById('btn-load-more');
  if (!append && !results.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--sub);font-weight:600">No results found</div>';
    lmw.style.display = 'none';
    return;
  }
  const html = results.map(resultCardHtml).join('');
  if (append) {
    grid.insertAdjacentHTML('beforeend', html);
  } else {
    grid.innerHTML = html;
  }
  // Show load more if a full page came back
  if (results.length >= SEARCH_LIMIT) {
    lmw.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Load more';
  } else {
    lmw.style.display = 'none';
  }
}

let _currentRoute = 'home';

function navigate(route, { pushState = true } = {}) {
  _currentRoute = route;
  const viewMap = { home: 'v-home', library: 'v-library', genres: 'v-genres', search: 'v-search' };
  const viewId = viewMap[route] || 'v-home';

// Section label decorator — adds italic emphasis on the last word
function decorateLabel(label) {
  const parts = label.trim().split(' ');
  if (parts.length === 1) return `<em>${esc(parts[0])}</em>`;
  const last = parts.pop();
  return `${esc(parts.join(' '))} <em>${esc(last)}</em>`;
}

let _sectionIdx = 0;
function renderDiscSection(label, items, container) {
  if (!items || !items.length) return;
  _sectionIdx++;
  const num = String(_sectionIdx).padStart(2, '0');
  const cardsHtml = items.map((m, i) => discCardHtml(m, i === 0)).join('');
  const sec = document.createElement('div');
  sec.className = 'home-section';
  sec.innerHTML = `
    <div class="home-section-head">
      <div>
        <div class="home-section-kicker">${num} / Section</div>
        <div class="home-section-label">${decorateLabel(label)}</div>
      </div>
      <div class="home-section-count">${String(items.length).padStart(2,'0')} titles</div>
    </div>
    <div class="disc-strip">${cardsHtml}</div>`;
  sec.querySelectorAll('.disc-card').forEach(el => {
    const id = el.dataset.id, src = el.dataset.source || 'mdex';
    el.addEventListener('click', () => openPanel(id, src));
    // Prefetch on hover (desktop) + touchstart (mobile)
    el.addEventListener('mouseenter', () => prefetchManga(id, src), { once: true });
    el.addEventListener('touchstart', () => prefetchManga(id, src), { once: true, passive: true });
  });
  container.appendChild(sec);
}

const HOME_CACHE_TTL = 20 * 60 * 1000; // 20 min
let _homeCache = null;

function getHomeCache() {
  if (_homeCache && Date.now() - _homeCache.ts < HOME_CACHE_TTL) return _homeCache.data;
  try {
    const raw = sessionStorage.getItem('homeCache_sw2');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.ts < HOME_CACHE_TTL) { _homeCache = parsed; return parsed.data; }
    }
  } catch (_) {}
  return null;
}

function setHomeCache(data) {
  _homeCache = { data, ts: Date.now() };
  try { sessionStorage.setItem('homeCache_sw2', JSON.stringify(_homeCache)); } catch (_) {}
}

function renderHomeData(data, wrap) {
  wrap.innerHTML = '';
  _sectionIdx = 0;
  const hasAny = (data.trending?.length || data.topRated?.length || data.newManga?.length || data.updated?.length);
  if (!hasAny) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="ekicker">No Signal</div>
      <div class="ekao">(˘･_･˘)</div>
      <div class="etitle">Nothing in the <em>archive</em>.</div>
      <div class="esub">The source is silent. Either the alt source isn't configured yet, or it's still warming up. Try a search, or check back in a moment.</div>
      <button class="ebtn" onclick="document.getElementById('search-input').focus()">Search Manga</button>
    </div>`;
    return;
  }
  renderDiscSection('Trending Now', data.trending, wrap);
  renderDiscSection('Latest Updates', data.updated, wrap);
  renderDiscSection('New Releases', data.newManga, wrap);
  renderDiscSection('Top Rated', data.topRated, wrap);
}

async function loadDiscoverySections({ forceRefresh = false } = {}) {
  const wrap = document.getElementById('discover-wrap');
  if (!wrap) return;
  const cached = getHomeCache();
  if (cached && !forceRefresh) {
    renderHomeData(cached, wrap);
    // silent background refresh
    fetch('/api/sw-home').then(r => r.json()).then(data => { setHomeCache(data); }).catch(() => {});
    return;
  }
  wrap.innerHTML = `<div class="disc-loading"><div class="spin" style="width:16px;height:16px;border-width:2px"></div> Loading…</div>`;
  try {
    const data = await fetch('/api/sw-home').then(r => r.json());
    setHomeCache(data);
    renderHomeData(data, wrap);
  } catch (e) {
    wrap.innerHTML = '';
  }
}

async function renderPanel({ manga, chapters }) {
  const saved = await IDB.get(manga.id);
  const isSaved = !!saved;

  const covHtml = manga.coverUrl
    ? `<img class="panel-cover" src="${esc(proxyUrl(manga.coverUrl, manga.coverReferer))}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="panel-cover-ph" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`
    : `<div class="panel-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;

  const tagsHtml = manga.tags.slice(0, 8).map(t =>
    `<button class="tag-pill" onclick="closePanel();selectGenreAndSearch('${esc(t.id)}')">${esc(t.name)}</button>`
  ).join('');
  const pillCls = statusPillClass(manga.status);

  document.getElementById('panel-hdr').innerHTML = `
    ${covHtml}
    <div class="panel-info">
      <div class="panel-title">${esc(manga.title)}</div>
      <div class="panel-meta">
        <button class="status-pill ${pillCls}" style="position:static;display:inline-block;margin-bottom:4px" onclick="closePanel();selectStatusSearch('${esc(manga.status)}')">${esc(manga.status)}</button>
        ${manga.year ? ' · ' + manga.year : ''}${manga.originalLanguage ? ' · ' + manga.originalLanguage.toUpperCase() : ''}
      </div>
      ${manga.rating ? `<div class="panel-rating">${starsHtml(manga.rating)}<span class="star-num">${manga.rating.toFixed(1)}/10</span></div>` : ''}
      <div class="panel-tags">${tagsHtml}</div>
      ${manga.description ? `<div class="panel-desc" id="panel-desc">${esc(manga.description.slice(0, 220))}${manga.description.length > 220 ? `<button class="btn-more-desc" onclick="expandDesc()" id="btn-more">More</button>` : ''}</div>` : ''}
      <div class="panel-action-row">
        <button class="panel-save-btn ${isSaved ? 'saved' : ''}" id="panel-save-btn" onclick="toggleSave()">
          <svg viewBox="0 0 24 24">${isSaved ? '<polyline points="20 6 9 17 4 12"/>' : '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'}</svg>
          ${isSaved ? 'Saved' : 'Add to Library'}
        </button>
        <button class="panel-dl-btn" id="panel-dl-btn" onclick="toggleSelectMode()">
          <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/></svg>
          Download
        </button>
      </div>
    </div>`;

  // Group chapters by volume
  const volumes = {};
  for (const ch of chapters) {

    volumes[vol].push(ch);
  }

  const savedData = await IDB.get(manga.id);
  const lastChId = savedData?.lastReadChapterId;

  // Reset select mode when panel re-renders
  selectMode = false; selectedChIds.clear();

  let chHtml = chapters.length ? `<div class="ch-actions-bar">
    <span class="ch-count-label">${chapters.length} chapter${chapters.length !== 1 ? 's' : ''}</span>

      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="8.5 11 12 15 15.5 11"/></svg>

  </div>` : '';

  for (const [vol, chs] of Object.entries(volumes)) {
    if (Object.keys(volumes).length > 1 || vol !== 'No Volume') {

      return `<div class="ch-row${isCur ? ' current-ch' : ''}" data-chid="${chIdEsc}" onclick="handleChRowClick('${chIdEsc}','${esc(manga.id)}','${esc(ch.chapter||'')}','${esc(ch.title||'')}')">

  if (!chapters.length) {
    chHtml = '<div class="panel-loading"><div class="spin"></div> Searching alt source…</div>';
  }

  document.getElementById('panel-body').innerHTML = chHtml;

  // Auto-search alt source when MangaDex has no chapters
  if (!chapters.length) searchAltForManga(manga.title || '');

function expandDesc() {

  d.textContent = currentMangaData.manga.description;

function closePanel() {
  const panel = document.getElementById('panel');
  panel.style.transform = '';
  panel.style.transition = '';
  document.getElementById('panel-bg').classList.remove('open');
  panel.classList.remove('open');
  selectMode = false; selectedChIds.clear();
  const bar = document.getElementById('panel-select-bar');
  if (bar) bar.classList.remove('show');

// Swipe-down to close panel
(function() {
  const panel = document.getElementById('panel');
  let startY = 0, dragging = false;
  panel.addEventListener('touchstart', e => {
    const body = document.getElementById('panel-body');
    if (body && body.scrollTop > 0) return; // only when scrolled to top
    startY = e.touches[0].clientY;
    dragging = true;
    panel.style.transition = 'none';
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  panel.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dy = e.changedTouches[0].clientY - startY;
    panel.style.transition = '';
    if (dy > 110) closePanel();
    else { panel.style.transform = 'translateY(0)'; }
  }, { passive: true });
})();

// Search alt source by title, show results inline in panel body
async function searchAltForManga(title) {
  document.getElementById('panel-body').innerHTML = '<div class="panel-loading"><div class="spin"></div> Searching alt source…</div>';
  try {
    const data = await fetch(`/api/sw-search?q=${encodeURIComponent(title)}`).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    if (!results.length) {
      document.getElementById('panel-body').innerHTML = '<div style="padding:30px;text-align:center;color:var(--sub);font-size:13px">No results found on alt source.</div>';
      return;
    }
    results.forEach(r => { _previewCache[r.id] = r; });
    document.getElementById('panel-body').innerHTML = `
      <div style="padding:12px 16px 4px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.06em;text-transform:uppercase">Alt Source Results</div>
      ${results.map(r => {
        const covSrc = r.coverUrl ? proxyUrl(r.coverUrl, r.coverReferer) : null;
        const img = covSrc ? `<img style="width:42px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0" src="${esc(covSrc)}" onerror="this.style.display='none'">` : '';
        return `<div onclick="closePanel();openPanel('${esc(r.id)}','alt')" style="display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border)">
          ${img}
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--fg)">${esc(r.title)}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:2px">${esc(r.status)}</div>
          </div>
        </div>`;
      }).join('')}`;
  } catch (e) {
    document.getElementById('panel-body').innerHTML = `<div style="padding:30px;text-align:center;color:var(--err);font-size:13px">Error: ${esc(e.message)}</div>`;
  }
}

async function toggleSave() {
  if (!currentMangaData) return;
  const { manga } = currentMangaData;
  const existing = await IDB.get(manga.id);
  if (existing) {
    await IDB.del(manga.id);
    showToast('Removed from library');
  } else {
    await IDB.save({
      id: manga.id,
      title: manga.title,
      coverUrl: manga.coverUrl,
      status: manga.status,
      description: manga.description,
      tags: manga.tags,
      originalLanguage: manga.originalLanguage,
      addedAt: Date.now(),
      lastReadChapterId: null,
      lastReadPage: 0,
      lastReadChapter: null
    });
    showToast('Added to library');
  }
  await loadLibrary();
  // Re-render save button
  const newSaved = await IDB.get(manga.id);
  const btn = document.getElementById('panel-save-btn');
  if (btn) {
    btn.className = `panel-save-btn${newSaved ? ' saved' : ''}`;
    btn.innerHTML = `<svg viewBox="0 0 24 24">${newSaved ? '<polyline points="20 6 9 17 4 12"/>' : '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'}</svg>${newSaved ? 'Saved' : 'Add to Library'}`;
  }
}
