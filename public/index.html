<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Mangaink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d2ff30'/><text y='72' x='50' text-anchor='middle' font-size='60' fill='%230d1117'>📚</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="dns-prefetch" href="https://uploads.mangadex.org"/>
<link rel="dns-prefetch" href="https://api.mangadex.org"/>
<!-- Kick off home API fetch ASAP, before JS even parses -->
<link rel="preload" as="fetch" href="/api/home" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Knewave&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ─── LIGHT MODE — white + ink monochrome brand ─── */
  --org:#0a0a0a;             /* brand = ink black */
  --org-text:#0a0a0a;
  --org-h:#1c1c1c;
  --org-s:rgba(10,10,10,.08);
  --ok:#16a34a;--err:#dc2626;--warn:#ca8a04;
  --bg:#ffffff;              /* pure white background */
  --card:#ffffff;
  --fg:#0a0a0a;              /* near-black ink */
  --sub:#6b6660;             /* neutral gray */
  --border:#ececec;          /* pale gray border */
  --surf:#f5f5f5;             /* light gray surface */
  --blk:#0a0a0a;             /* deep ink for primary buttons */
  --blk-h:#1c1c1c;
  --blk-text:#ffffff;         /* white text on ink buttons */
  --r:8px;
}
html,body{height:100%;height:-webkit-fill-available;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;letter-spacing:-.005em}
/* Subtle film grain over background for depth */
/* (grain texture removed — it broke backdrop-filter via mix-blend-mode stacking context) */
.app-body{position:relative;z-index:0}
/* Hide all scrollbars (mobile & desktop) — kept scrollable, just invisible */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
-webkit-tap-highlight-color:transparent;

/* ─── TOPBAR ─── */
.topbar{background:var(--bg);flex-shrink:0;position:fixed;top:0;left:0;right:0;z-index:9999;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transform:translateZ(0);will-change:transform;isolation:isolate}
body.reader-open .topbar{display:none !important;visibility:hidden !important;}
.topbar-r1{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;padding-top:max(12px, env(safe-area-inset-top, 12px))}
.app-title{font-family:'Knewave',cursive;font-size:24px;font-weight:400;color:#0a0a0a;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.ttab-group{display:flex;align-items:center;gap:2px}
.ttab-icon{width:44px;height:44px;border:none;background:none;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative}
.ttab-icon.active{color:var(--org-text)}
.ttab-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.lib-badge{position:absolute;top:4px;right:4px;min-width:14px;height:14px;background:var(--org);color:#fff;font-size:8px;font-weight:800;border-radius:99px;padding:0 3px;line-height:14px;text-align:center;display:none;pointer-events:none}
.topbar-r2{padding:0 12px 11px;display:flex;align-items:center;gap:8px}
.r2-search{display:flex;align-items:center;gap:8px;flex:1}
.r2-library{display:none;align-items:center;gap:8px;flex:1}
.search-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.search-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;color:var(--fg);padding:9px 36px 9px 16px;outline:none;transition:border-color .2s,background .2s;min-width:0;letter-spacing:-.005em}
.search-input:hover{border-color:rgba(10,10,10,.4)}
.search-input:focus{border-color:var(--org-text);background:var(--bg)}
.search-input::placeholder{color:#a8a29e}
.btn-clear-input{position:absolute;right:8px;width:22px;height:22px;border:none;background:none;cursor:pointer;color:#aaa;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:color .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn-clear-input:hover{color:var(--fg)}
.btn-clear-input svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}
.btn-src-toggle{flex-shrink:0;border:1.5px solid var(--border);background:none;border-radius:99px;font-family:inherit;font-size:11px;font-weight:800;color:var(--sub);padding:5px 10px;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;letter-spacing:.02em}
.btn-src-toggle.alt-active{border-color:var(--org-text);color:var(--org-text);background:color-mix(in srgb,var(--org) 12%,transparent)}
.alt-source-badge{font-size:9px;font-weight:800;background:var(--org);color:#fff;border-radius:4px;padding:1px 4px;margin-left:4px;letter-spacing:.04em;vertical-align:middle}
.btn-load-more{padding:10px 28px;background:var(--bg);border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-load-more:hover{border-color:var(--blk);background:var(--blk);color:#fff}
.btn-load-more:disabled{opacity:.45;cursor:default}
.btn-search{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:600;letter-spacing:-.005em;cursor:pointer;transition:transform .15s,box-shadow .25s;white-space:nowrap;min-height:36px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 6px 16px -6px rgba(10,10,10,.5),0 1px 0 rgba(60,50,30,.06)}
.btn-search:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(10,10,10,.7)}
.btn-search:active{transform:translateY(0)}
.btn-search:hover{background:var(--blk-h)}
.btn-search:active{background:var(--blk-h);transform:scale(.96)}
.btn-search svg{width:13px;height:13px;stroke:var(--blk-text);fill:none}

/* ─── LAYOUT ─── */
/* app-body absolutely fills viewport so fixed topbar doesn't push it down */
.app-body{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;overflow-y:auto;flex-direction:column;min-height:0}
.view.active{display:flex}
/* Pad below fixed topbar. Mobile topbar ~50px, desktop ~65px (set per breakpoint) */
#v-library{padding-top:52px}
#v-home{padding-top:0}
/* Search: header stays pinned; inner body scrolls */
#v-search{overflow:hidden;padding-top:52px;flex-direction:column}
#search-body{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}

/* ─── SEARCH VIEW ─── */
.search-hint{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;font-weight:600}
.search-loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--sub);font-size:14px;font-weight:600}
.spin{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--org-text);border-radius:50%;animation:rspin .7s linear infinite;flex-shrink:0}
@keyframes rspin{to{transform:rotate(360deg)}}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px}
.result-card{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s}
.result-card:active{transform:scale(.97)}
.result-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surf)}
.result-cover{width:100%;height:100%;object-fit:cover;display:block}
.result-cover-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.result-cover-ph svg{width:32px;height:32px;stroke:#c8bdb8;fill:none}
.status-pill{position:absolute;bottom:6px;left:6px;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.04em}
.pill-ongoing{background:rgba(22,163,74,.9);color:#fff}
.pill-completed{background:rgba(37,99,235,.9);color:#fff}
.pill-hiatus{background:rgba(217,119,6,.9);color:#fff}
.pill-cancelled{background:rgba(220,38,38,.9);color:#fff}
.result-title{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--fg);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.result-meta{font-size:10px;color:var(--sub);margin-top:3px}

/* ─── HOME / LIBRARY / DISCOVERY ─── */

/* Topbar library button */
.topbar-lib-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:none;border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.topbar-lib-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.topbar-lib-btn.active{border-color:var(--org-text);color:var(--org-text);background:var(--org-s)}
.topbar-lib-btn:hover{border-color:var(--blk);color:var(--blk)}

/* Library page */
.lib-page-hdr{padding:14px 16px 0;flex-shrink:0}
.lib-page-title{font-size:20px;font-weight:800;color:var(--fg);font-family:'Space Grotesk',sans-serif}
.lib-empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;font-weight:600;line-height:1.6}

/* Unified section wrapper */
.home-section{padding:18px 0 4px;flex-shrink:0;position:relative}
.home-section:first-of-type{padding-top:8px}
.home-section-head{margin-bottom:10px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.home-section-label{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-.01em;line-height:1.2;flex:1}
.view-all-btn{display:inline-flex;align-items:center;gap:2px;background:none;border:none;color:var(--sub);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:-.005em;cursor:pointer;padding:4px 4px 4px 10px;border-radius:99px;-webkit-tap-highlight-color:transparent;transition:color .15s,background .15s}
.view-all-btn:hover{color:#0a0a0a;background:var(--surf)}
.view-all-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.home-section-label em{font-style:normal;color:var(--fg);font-weight:700}
.home-section-kicker,.home-section-count{display:none}

/* ─── HERO FEATURED CAROUSEL ─── */
.hero-card{position:relative;margin:16px 16px 8px;border-radius:10px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#0a0a0a;transition:transform .25s}
/* Slides stacked, instant swap (no fade animation) */
.hero-slide{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.hero-slide.active{visibility:visible;pointer-events:auto}
.hero-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4;pointer-events:auto}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);border:none;cursor:pointer;transition:all .25s;padding:0;-webkit-tap-highlight-color:transparent}
.hero-dot.active{background:#fff;width:22px;border-radius:99px}
.hero-dot:hover:not(.active){background:rgba(255,255,255,.7)}
/* Hero next-arrow button (mid-right, fades in on hover or recent swipe) */
.hero-next-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:4;opacity:0;transition:opacity .25s,background .15s,transform .15s}
.hero-card:hover .hero-next-btn{opacity:1}
.hero-next-btn:hover{background:rgba(255,255,255,.32);transform:translateY(-50%) scale(1.05)}
.hero-next-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (hover:none){.hero-next-btn{opacity:.7}}
.hero-card:hover{transform:translateY(-2px)}
.hero-card:active{transform:scale(.99)}
..hero-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(10,10,10,.45) 55%,rgba(10,10,10,.88) 100%);pointer-events:none}
.hero-content{position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;color:#fff;z-index:2;pointer-events:none}
.hero-kicker{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:#fff;letter-spacing:.05em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hero-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.95);font-size:12px;font-weight:600}
.hero-stars{display:inline-flex;align-items:center;gap:2px}
.hero-stars .star{font-size:11px}
.hero-stars .star-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#fff;margin-left:4px}
.hero-status{display:inline-block;padding:2px 8px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:capitalize}
.hero-actions{display:flex;gap:10px;margin-top:6px;pointer-events:auto}
.hero-read{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);color:#fff;border:1px solid rgba(255,255,255,.45);padding:10px 22px;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em;transition:background .15s,transform .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.hero-read:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
/* If browser doesn't support backdrop-filter, fall back to semi-solid */
@supports not (backdrop-filter:blur(1px)){.hero-read{background:rgba(255,255,255,.85);color:#0a0a0a}.hero-read{box-shadow:none}}
.hero-read:hover{transform:translateY(-1px)}
.hero-read svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2}
.hero-skel{position:absolute;inset:0;background:linear-gradient(90deg,var(--surf) 0%,rgba(0,0,0,.04) 50%,var(--surf) 100%);background-size:200% 100%;animation:skelShim 1.6s linear infinite}

/* Unified manga card — used everywhere on home */
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;padding-bottom:4px}
.mc-card{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s}
.mc-card:active{transform:scale(.96)}
.mc-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surf);flex-shrink:0}
.mc-cover{width:100%;height:100%;object-fit:cover;display:block}
.mc-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.mc-ph svg{width:24px;height:24px;stroke:#c8bdb8;fill:none}
.mc-ch-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.72);color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:3px;white-space:nowrap}
.mc-title{margin-top:5px;font-size:11px;font-weight:700;color:var(--fg);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mc-sub{font-size:9.5px;color:var(--fg);font-weight:700;margin-top:1px}

/* Discovery horizontal strip */
.disc-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.disc-strip::-webkit-scrollbar{display:none}
/* Disc section scroll arrows */
.disc-strip-wrap{position:relative}
.disc-arrow{position:absolute;top:50%;transform:translateY(-60%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;transition:opacity .18s,transform .18s;-webkit-tap-highlight-color:transparent}
.disc-arrow:hover{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.disc-arrow:active{transform:translateY(-60%) scale(.92)}
.disc-arrow.da-left{left:4px}
.disc-arrow.da-right{right:4px}
.disc-arrow svg{width:17px;height:17px;stroke:#0a0a0a;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.disc-arrow.da-hidden{opacity:0;pointer-events:none}
@media (pointer:coarse){.disc-arrow{display:none !important}}
/* 3 cards visible per row on mobile */
.disc-card{flex-shrink:0;width:calc((100vw - 56px) / 3);max-width:140px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .25s cubic-bezier(.2,.8,.2,1);position:relative}
.disc-card:hover{transform:translateY(-3px)}
.disc-card:active{transform:scale(.97)}
.disc-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surf);box-shadow:0 1px 0 rgba(60,50,30,.06),0 6px 18px -8px rgba(60,50,30,.18);transition:box-shadow .25s,transform .25s}
.disc-card:hover .disc-cover-wrap{box-shadow:0 1px 0 rgba(60,50,30,.08),0 14px 30px -10px rgba(60,50,30,.28),0 0 0 1.5px var(--org)}
.disc-cover-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none;opacity:0;transition:opacity .25s}
.cr-resume-badge{position:absolute;bottom:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--org);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.cr-resume-badge svg{width:11px;height:11px;margin-left:1px}
.cr-chapter{margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--org-text);letter-spacing:.02em}
.disc-update-line{margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--org-text);letter-spacing:.01em}
.disc-card:hover .disc-cover-wrap::after{opacity:1}
.disc-cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.disc-card:hover .disc-cover{transform:scale(1.04)}
.disc-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--surf),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center}
.disc-ph svg{width:22px;height:22px;stroke:var(--sub);fill:none;opacity:.5}
.disc-rating-row{display:flex;align-items:center;gap:2px;margin-top:4px}
.disc-rating-row .star{font-size:11px}
.disc-rating-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:.02em}
.disc-title{margin-top:8px;font-size:13px;font-weight:600;color:var(--fg);line-height:1.32;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-.005em}
.disc-chapter-badge{position:absolute;bottom:6px;left:6px;background:rgba(10,10,10,.75);color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.02em;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3}
/* (lead variant removed — all cards same size now) */
/* Skeleton state for home cards */
.disc-card.skel{pointer-events:none}
.skel-shim{background:linear-gradient(90deg,var(--surf) 0%,rgba(255,255,255,.04) 50%,var(--surf) 100%);background-size:200% 100%;animation:skelShim 1.6s linear infinite;border-radius:3px}
.disc-title-skel{margin-top:8px;height:11px;width:80%;border-radius:3px}
.disc-card.skel:nth-child(2) .disc-title-skel{width:65%}
.disc-card.skel:nth-child(3) .disc-title-skel{width:90%}
.disc-card.skel:nth-child(4) .disc-title-skel{width:55%}
.disc-card.skel:nth-child(5) .disc-title-skel{width:75%}
.skel-section .home-section-label,.skel-section .home-section-kicker{opacity:.5}
/* Fade-in stagger on first paint */
@keyframes discIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.home-section{animation:discIn .55s cubic-bezier(.2,.8,.2,1) both}
.home-section:nth-child(1){animation-delay:.02s}
.home-section:nth-child(2){animation-delay:.08s}
.home-section:nth-child(3){animation-delay:.14s}
.home-section:nth-child(4){animation-delay:.20s}
.home-section:nth-child(5){animation-delay:.26s}
.disc-loading{padding:20px;text-align:center;color:var(--sub);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}

/* ─── LIBRARY VIEW (legacy — unused but kept for safety) ─── */
.lib-grid-section{padding:14px 16px;flex:1}
.lib-search{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:99px;font-family:inherit;font-size:13px;color:var(--fg);padding:7px 14px;outline:none;transition:all .15s;min-width:0}
.lib-search:focus{border-color:var(--org-text);box-shadow:0 0 0 3px var(--org-s)}
.lib-search::placeholder{color:#a8a29e}
.manga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.manga-card{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.manga-card-cover-wrap{position:relative;width:100%;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:var(--surf);transition:transform .18s,box-shadow .18s}
.manga-card:active .manga-card-cover-wrap{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.manga-card-cover{width:100%;height:100%;object-fit:cover;display:block}
.manga-card-ph{width:100%;height:100%;background:var(--surf);display:flex;align-items:center;justify-content:center}
.manga-card-ph svg{width:28px;height:28px;stroke:#c8bdb8;fill:none}
.ch-badge{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.75);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px}
.del-btn{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:2;-webkit-tap-highlight-color:transparent}
.del-btn svg{width:10px;height:10px;stroke:#fff;fill:none}
@media(hover:hover){.manga-card:hover .del-btn{opacity:1}}
@media(hover:none){.del-btn{opacity:.8}}
.manga-card-title{margin-top:6px;font-size:11px;font-weight:700;color:var(--fg);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 40px;text-align:center}
.empty-state .ekao{font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--org-text);letter-spacing:-.02em;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.empty-state .etitle{font-family:'Inter',sans-serif;font-size:22px;font-weight:800;color:var(--fg);letter-spacing:-.025em;line-height:1.15;max-width:340px}
.empty-state .etitle em{color:var(--fg);font-style:normal;font-weight:800}
.empty-state .esub{font-family:'Inter',sans-serif;font-size:13px;color:var(--sub);max-width:300px;line-height:1.55;font-weight:400}
.empty-state .ekicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);letter-spacing:.18em;display:flex;align-items:center;gap:8px}
.empty-state .ekicker::before,.empty-state .ekicker::after{content:'';width:18px;height:1px;background:var(--border)}
.empty-state .ebtn{margin-top:6px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:-.01em;padding:11px 24px;cursor:pointer;transition:transform .15s,box-shadow .25s;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 20px -6px rgba(10,10,10,.55),0 1px 0 rgba(60,50,30,.08)}
.empty-state .ebtn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -6px rgba(10,10,10,.7),0 2px 4px rgba(60,50,30,.08)}
.empty-state .ebtn:active{transform:translateY(0)}
.empty-icon svg{width:44px;height:44px;stroke:#d6d3d1;fill:none}
.empty-title{font-size:15px;font-weight:700;color:var(--fg)}
.empty-sub{font-size:13px;color:var(--sub);max-width:260px;line-height:1.5}

/* ─── MANGA DETAIL PANEL ─── */
.panel-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.panel-bg.open{display:block}
.panel{position:fixed;bottom:0;left:0;right:0;height:85vh;background:var(--card);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.panel.open{transform:translateY(0)}
.panel-hdr{display:flex;align-items:flex-start;gap:14px;padding:16px 16px 12px;flex-shrink:0}
.panel-drag{width:36px;height:4px;background:#e0dcd8;border-radius:99px;margin:0 auto 12px;flex-shrink:0}
.panel-cover{width:100px;height:150px;border-radius:6px;object-fit:cover;background:var(--surf);flex-shrink:0}
.panel-cover-ph{width:100px;height:150px;border-radius:6px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.panel-cover-ph svg{width:30px;height:30px;stroke:#c8bdb8;fill:none}
.panel-info{flex:1;min-width:0;padding-top:2px}
.panel-title{font-size:17px;font-weight:800;color:var(--fg);line-height:1.3;margin-bottom:6px}
.panel-meta{font-size:12px;color:var(--sub);margin-bottom:8px}
.panel-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag-pill{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:10px;color:var(--sub);font-weight:600}
button.tag-pill{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s}
button.tag-pill:hover{border-color:var(--org-text);color:var(--org-text);background:var(--org-s)}
button.status-pill{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
button.status-pill:hover{opacity:.75}
.panel-desc{font-size:12px;color:var(--sub);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel-desc.expanded{display:block;-webkit-line-clamp:unset}
.btn-more-desc{display:inline;background:none;border:none;font-family:inherit;font-size:11px;color:var(--org-text);font-weight:700;cursor:pointer;padding:0 0 0 3px;-webkit-tap-highlight-color:transparent}
.panel-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);-webkit-tap-highlight-color:transparent;z-index:1}
.panel-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.panel-save-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.panel-save-btn:hover{background:var(--org-h)}
.panel-save-btn.saved{background:var(--org);color:#fff}
.panel-save-btn svg{width:12px;height:12px;stroke:#fff;fill:none}
.panel-body{flex:1;overflow-y:auto;min-height:0}
.ch-section-hdr{padding:12px 16px 6px;font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.05em;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--border)}
.ch-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent}
.ch-row:last-child{border-bottom:none}
.ch-row.current-ch{background:var(--org-s)}
.ch-row-info{flex:1;min-width:0}
.ch-num{font-size:13px;font-weight:700;color:var(--fg)}
.ch-row.current-ch .ch-num{color:var(--org-text)}
.ch-title{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-pages{font-size:10px;color:#a8a29e;margin-top:2px}
.ch-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-read{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s;min-height:36px;white-space:nowrap}
.btn-read:hover{background:var(--blk-h)}
.btn-read svg{width:11px;height:11px;stroke:var(--blk-text);fill:var(--blk-text);flex-shrink:0}
.btn-dl-ch{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;height:36px;border:1.5px solid var(--border);border-radius:99px;background:var(--card);cursor:pointer;font-family:inherit;font-size:11px;font-weight:800;color:var(--fg);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:all .15s;white-space:nowrap;letter-spacing:.02em}
.btn-dl-ch:hover{border-color:var(--blk);background:var(--blk);color:#fff}
.btn-dl-ch:hover svg{stroke:#fff}
.btn-dl-ch svg{width:13px;height:13px;stroke:currentColor;fill:none;flex-shrink:0}
.btn-dl-ch.dl-loading svg{animation:rspin .7s linear infinite}
.panel-loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--sub);font-size:14px;font-weight:600}

/* ─── DETAIL PAGE (full-screen) ─── */
.topbar-back-btn{display:none;align-items:center;gap:2px;background:none;border:none;font:700 15px 'Inter',sans-serif;color:#0a0a0a;cursor:pointer;padding:6px 8px 6px 0;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
.topbar-back-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
body[data-route="detail"] .topbar-back-btn{display:flex}
body[data-route="detail"] .app-title{display:none}
body[data-route="detail"] .topbar-search-desktop{visibility:hidden;pointer-events:none}
body[data-route="detail"] .topbar-desktop-nav{visibility:hidden;pointer-events:none}
body[data-route="detail"] .topbar{background:#fff !important;box-shadow:0 1px 0 var(--border) !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
body[data-route="detail"] .bnav{display:none !important}
body[data-route="detail"] .panel-bg{display:none !important}
body[data-route="detail"] .panel-drag{display:none !important}
body[data-route="detail"] .panel-close{display:none}
body[data-route="detail"] #panel{position:fixed !important;inset:0 !important;height:100% !important;transform:none !important;transition:none !important;border-radius:0 !important;z-index:9998 !important;padding-top:52px;display:flex !important}

/* ─── READER ─── */
.reader-overlay{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.reader-overlay.hidden{display:none}
.reader-top{height:50px;background:rgba(0,0,0,.85);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;position:absolute;top:0;left:0;right:0;z-index:2;transition:opacity .2s}
.reader-top.hide{opacity:0;pointer-events:none}
.reader-back{display:flex;align-items:center;gap:4px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;padding:6px 10px;border-radius:99px;transition:background .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.reader-back:hover{background:rgba(255,255,255,.1)}
.reader-back svg{width:14px;height:14px;stroke:#fff;fill:none}
.reader-meta{flex:1;min-width:0;text-align:center}
.reader-title-txt{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-ch-txt{font-size:10px;color:rgba(255,255,255,.6)}
.reader-mode-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
.reader-mode-btn:active{background:rgba(255,255,255,.25)}
.reader-mode-btn.active{background:var(--org);color:#fff}
.reader-toc-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.reader-toc-btn:active{background:rgba(255,255,255,.25)}
.reader-toc-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Page counter — bottom center floating pill */
.reader-pg-counter{background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:6px 18px;border-radius:99px;pointer-events:none;letter-spacing:.06em;white-space:nowrap;flex-shrink:0}
.reader-mode-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Reader area */
.reader-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer}
.reader-img-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.reader-img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
/* Vertical (webtoon/manhua) infinite-scroll mode */
.reader-area.vertical{display:block;overflow-y:auto;overflow-x:hidden;cursor:default;align-items:stretch;justify-content:flex-start;scroll-behavior:smooth}
.reader-area.vertical .reader-img-wrap{display:block;height:auto;min-height:100%;padding:0;max-width:720px;margin:0 auto}
.reader-area.vertical .reader-vpage{display:block;width:100%;background:#000;position:relative}
.reader-area.vertical .reader-vpage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.reader-area.vertical .reader-vpage.loading::before{content:'';display:block;width:100%;aspect-ratio:4/5;background:linear-gradient(180deg,#0a0a0a,#1a1a1a)}
.reader-area.vertical .reader-vpage-num{position:absolute;top:6px;right:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.06em;pointer-events:none;mix-blend-mode:difference}
.reader-area.vertical .reader-vend{padding:48px 20px 80px;text-align:center;color:rgba(255,255,255,.55);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.005em}
.reader-area.vertical .reader-vend button{margin-top:14px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:10px 22px;cursor:pointer}
/* Hide tap zones in vertical mode (they block scroll) */
.reader-overlay.vmode .tap-zone{display:none}
.reader-overlay.vmode .reader-bottom-bar{display:none !important}
/* Bottom bar: [left ch btn] [page counter] [right ch btn] — single row */
.reader-bottom-bar{position:absolute;bottom:16px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:4;pointer-events:none;transition:opacity .2s}
.reader-bottom-bar.hide{opacity:0;pointer-events:none}
.reader-ch-nav-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:99px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,opacity .2s;pointer-events:auto;letter-spacing:.01em}
.reader-ch-nav-btn:active{background:rgba(0,0,0,.8)}
.reader-ch-nav-btn:disabled{opacity:.25;cursor:default;pointer-events:none}
.reader-ch-nav-btn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* Mobile momentum scroll */
.reader-area.vertical{-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-behavior:auto}
.reader-page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.6);font-size:14px;font-weight:600}
.reader-spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--org-text);border-radius:50%;animation:rspin .75s linear infinite}
.reader-error{color:rgba(255,255,255,.5);text-align:center;padding:20px;font-size:13px}

/* Progress bar */
.reader-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:2}
.reader-progress-fill{height:100%;background:var(--org);transition:width .2s}
/* Next chapter callout — shown at end of chapter */
.next-ch-btn{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);padding:10px 24px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:5;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(10,10,10,.55);transition:opacity .2s}
.next-ch-btn:active{opacity:.8}
.reader-overlay.vmode .next-ch-btn{display:none !important}

/* Touch zones (invisible) */
.tap-zone{position:absolute;top:50px;bottom:3px;width:30%;z-index:3}
.tap-left{left:0}
.tap-right{right:0}
.tap-center{left:30%;right:30%;cursor:default}


/* ─── TOC PANEL ─── */
.toc-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110;display:none}
.toc-bg.open{display:block}
.toc-panel{position:fixed;bottom:0;left:0;right:0;max-height:72vh;background:var(--card);border-radius:18px 18px 0 0;z-index:111;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.toc-panel.open{transform:translateY(0)}
.toc-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.toc-title-label{font-size:13px;font-weight:800;color:var(--fg)}
.toc-close{background:none;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);-webkit-tap-highlight-color:transparent}
.toc-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.toc-list{flex:1;overflow-y:auto;padding:6px 0}
.toc-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s}
.toc-item:active{background:var(--bg)}
.toc-item.cur{background:var(--org-s)}
.toc-num{font-size:10px;font-weight:700;color:var(--sub);min-width:36px;flex-shrink:0}
.toc-name{font-size:13px;color:var(--fg);flex:1}
.toc-pages{font-size:10px;color:var(--sub);flex-shrink:0}
.toc-item.cur .toc-num,.toc-item.cur .toc-name{color:var(--org-text);font-weight:700}

/* ─── FAB ─── */
.fab{display:none;position:fixed;bottom:22px;right:18px;width:54px;height:54px;border-radius:50%;background:var(--blk);border:none;color:var(--org);cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:30;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s,box-shadow .15s}
.fab svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:99px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── MOBILE ─── */
@media(max-width:700px){
  .results-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:12px}
  .manga-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
  .fab{display:flex}
}

/* ─── SEARCH DROPDOWN ─── */
.search-dropdown{position:fixed;top:108px;left:8px;right:8px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.15);display:none;overflow:hidden;max-height:70vh;overflow-y:auto}
.search-dropdown.open{display:block}
.sdrop-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent;transition:background .1s;touch-action:manipulation}
.sdrop-item:last-child{border-bottom:none}
.sdrop-item:hover,.sdrop-item:active{background:var(--bg)}
.sdrop-cover{width:34px;height:50px;border-radius:3px;object-fit:cover;flex-shrink:0;background:#e8e8e8}
.sdrop-cover-ph{width:34px;height:50px;border-radius:3px;flex-shrink:0;background:var(--org-s);display:flex;align-items:center;justify-content:center}
.sdrop-cover-ph svg{width:13px;height:13px;stroke:#aaa;fill:none}
.sdrop-info{flex:1;min-width:0}
.sdrop-title{font-size:13px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdrop-meta{font-size:10px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:5px}
.sdrop-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.03em}
.sdrop-loading{display:flex;flex-direction:column;gap:4px;padding:8px 12px}
.sdrop-skel{display:flex;gap:10px;align-items:center;padding:8px 4px;border-radius:6px;overflow:hidden;position:relative}
.sdrop-skel-cover{width:38px;height:54px;border-radius:4px;background:linear-gradient(90deg,var(--surf) 0%,var(--border) 50%,var(--surf) 100%);background-size:200% 100%;animation:skelShim 1.4s linear infinite;flex-shrink:0}
.sdrop-skel-lines{flex:1;display:flex;flex-direction:column;gap:6px}
.sdrop-skel-line{height:10px;border-radius:3px;background:linear-gradient(90deg,var(--surf) 0%,var(--border) 50%,var(--surf) 100%);background-size:200% 100%;animation:skelShim 1.4s linear infinite}
.sdrop-skel-line.short{width:60%}
.sdrop-skel-line.tiny{width:35%;height:8px}
@keyframes skelShim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sdrop-search-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.08em;padding:4px 8px 2px;display:flex;align-items:center;gap:6px}
.sdrop-search-label::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--org);animation:pulse 1.2s ease-in-out infinite}
.sdrop-more-btn{display:block;width:calc(100% - 24px);margin:8px 12px 12px;padding:10px 14px;background:transparent;border:1px dashed var(--border);border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--sub);cursor:pointer;letter-spacing:.04em;transition:all .15s;-webkit-tap-highlight-color:transparent}
.sdrop-more-btn:hover{border-color:var(--org-text);color:var(--org-text);background:rgba(10,10,10,.05)}
.sdrop-empty-btn{display:inline-block;margin-top:10px;padding:8px 16px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
.sdrop-empty{text-align:center;padding:18px;font-size:13px;color:var(--sub);font-weight:600}

/* ─── PREDICTIVE SEARCH RESULT DESCRIPTION ─── */
.result-desc{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ─── STAR RATING ─── */
.star-row{display:flex;align-items:center;gap:3px;margin-top:4px}
.stars{display:flex;align-items:center;gap:1px;line-height:1}
.star{font-size:10px;color:#d4d0cc}
.star.on{color:#f59e0b}
.star.half{position:relative;color:#d4d0cc}
.star.half::before{content:'★';position:absolute;left:0;width:50%;overflow:hidden;color:#f59e0b}
.star-num{font-size:10px;font-weight:700;color:var(--sub);margin-left:2px}
/* panel rating — slightly bigger */
.panel-rating{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.panel-rating .stars .star{font-size:13px}
.panel-rating .star-num{font-size:12px;font-weight:700;color:var(--sub)}
/* dropdown rating */
.sdrop-rating{display:flex;align-items:center;gap:2px;margin-top:2px}
.sdrop-rating .star{font-size:9px}
.sdrop-rating .star-num{font-size:9px;font-weight:700;color:var(--sub);margin-left:1px}

/* ─── CHAPTER ACTIONS BAR ─── */
.ch-actions-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--border);flex-shrink:0}
.btn-select-all-icon{display:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;color:var(--sub);align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:all .15s;flex-shrink:0}
.btn-select-all-icon.visible{display:flex}
.btn-select-all-icon:hover{border-color:var(--fg);color:var(--fg)}
.btn-select-all-icon.all-checked{border-color:var(--org-text);background:var(--org);color:#fff}
.btn-select-all-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.ch-count-label{font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.05em}
.btn-toggle-select{background:none;border:1.5px solid var(--border);border-radius:99px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:all .15s}
.btn-toggle-select.active{border-color:var(--org-text);color:var(--org-text);background:var(--org-s)}

/* ─── CHAPTER CHECKBOX ─── */
.ch-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:none;align-items:center;justify-content:center;transition:all .15s;background:var(--card);cursor:pointer}
.ch-checkbox.visible{display:flex}
.ch-checkbox.checked{background:var(--org);border-color:var(--org-text)}
.ch-checkbox svg{display:none;width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3}
.ch-checkbox.checked svg{display:block}
.ch-row{cursor:pointer}
.ch-row:active{background:#f5f4f2}
/* ─── CHAPTER TREE (multi-source) ─── */
.ch-group-hdr{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#f8f7f5;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;position:sticky;top:0;z-index:2}
.ch-group-hdr:active{background:#f0eeeb}
.ch-group-label{font-size:12px;font-weight:800;color:var(--fg);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ch-group-cnt{font-size:10px;font-weight:700;color:var(--sub);background:rgba(0,0,0,.07);padding:1px 7px;border-radius:99px;flex-shrink:0}
.ch-group-chevron{width:14px;height:14px;stroke:var(--sub);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .18s}
.ch-group.collapsed .ch-group-chevron{transform:rotate(-90deg)}
.ch-group.collapsed .ch-sources-list{display:none}
.ch-sources-list{border-bottom:1px solid var(--border)}
.ch-source{display:flex;align-items:center;gap:6px;padding:9px 12px 9px 0;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
.ch-source:hover{background:var(--surf)}
.ch-source.current-ch{background:var(--org-s)}
.ch-source:active{background:#f0eeeb}
/* Tree connector column */
.ch-tree-col{width:28px;flex-shrink:0;align-self:stretch;position:relative}
.ch-tree-col::before{content:'';position:absolute;left:13px;top:0;bottom:50%;width:1.5px;background:var(--border)}
.ch-source:not(:last-child) .ch-tree-col::before{bottom:0}
.ch-tree-col::after{content:'';position:absolute;left:13px;top:50%;transform:translateY(-50%);width:10px;height:1.5px;background:var(--border)}
/* Flag (left) + right-aligned info */
.ch-source-flag{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;line-height:1}
.ch-source-flag img{border-radius:1px;display:block;flex-shrink:0}
.ch-src-num{font-size:12px;font-weight:800;color:#0a0a0a;line-height:1;white-space:nowrap}
.ch-source-right{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ch-source-group{font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;text-align:right}
.ch-source-time{font-size:10px;color:var(--sub);font-weight:500}
.ch-source-pages{font-size:10px;color:#a8a29e;font-weight:500}
/* Single-row right-side info */
.ch-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;margin-left:auto;padding-left:8px}
.ch-row-right .ch-source-group{font-size:11px;font-weight:600;color:var(--sub)}
.ch-row-right .ch-source-time{font-size:10px;color:#a8a29e}
/* External chapter */
.ch-external-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:rgba(59,130,246,.12);color:#2563eb;letter-spacing:.02em;flex-shrink:0;white-space:nowrap}
.ch-external-badge svg{width:9px;height:9px;stroke:#2563eb;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-source.is-external .ch-source-group{color:var(--sub)}

/* ─── NAV TABS (legacy, hidden) ─── */
.topbar-r3, .nav-tabs-row{display:none !important}

/* ─── BOTTOM TAB NAV (floating pill, centered, selected = black circle) ─── */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0));display:inline-flex;align-items:stretch;gap:6px;background:rgba(255,255,255,.4);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(0,0,0,.06);border-radius:99px;padding:8px;box-shadow:0 8px 32px -8px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.06);z-index:50;min-width:280px}
@supports not (backdrop-filter:blur(1px)){.bnav{background:rgba(255,255,255,.92)}}
.bnav-tab{flex:1;min-width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 14px;background:none;border:none;border-radius:99px;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#0a0a0a;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:-.005em;transition:background .18s,color .18s,transform .15s}
.bnav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav-tab[data-route="home"] svg{width:24px;height:24px}
.bnav-tab span{display:block;line-height:1}
.bnav-tab:active{transform:scale(.94)}
.bnav-tab.active{background:#0a0a0a;color:#fff;font-weight:700}
.bnav-tab.active svg{stroke:#fff;fill:none;stroke-width:2}
/* App body padding-bottom — none (bottom nav is floating, no reserved space needed) */
/* No reserved space — content scrolls UNDER the floating pill so it shows through the blur */
.app-body{padding-bottom:0}
/* Last home-section gets extra bottom space so last manga row isn't permanently hidden by pill */
.home-section:last-of-type,.search-genres-section,#lib-page-wrap{padding-bottom:90px}
.nav-pill.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--org);box-shadow:0 0 8px rgba(10,10,10,.6)}

/* ─── GENRE PAGE ─── */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:16px}
.genre-card{padding:14px 10px;border:1.5px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--fg);background:var(--card);-webkit-tap-highlight-color:transparent;transition:all .15s;font-family:inherit}
.genre-card:hover{border-color:var(--org-text);color:var(--org-text);background:var(--org-s)}
.genre-card:active{transform:scale(.96)}

/* ─── THEME TOGGLE ─── (removed) ─── */

/* ─── PANEL ACTION ROW ─── */
.panel-action-row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.panel-start-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:transparent;color:var(--fg);border:1.5px solid var(--fg);border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.panel-start-btn:hover{background:var(--fg);color:#fff}
.panel-start-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel-dl-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--org);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.panel-dl-btn:hover{background:var(--org-h)}
.panel-dl-btn.active{background:var(--surf);color:var(--fg)}
.panel-dl-btn svg{width:12px;height:12px;stroke:currentColor;fill:none}

/* ─── FORMAT TOGGLE ─── */
.fmt-toggle{display:flex;background:var(--surf);border-radius:8px;overflow:hidden;flex-shrink:0;padding:2px;gap:2px}
.fmt-btn{background:none;border:none;padding:5px 9px;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;border-radius:6px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.fmt-btn.active{background:var(--org);color:#fff}
.fmt-kindle{font-size:8px;font-weight:800;background:rgba(0,0,0,.15);border-radius:3px;padding:1px 4px;letter-spacing:.03em}

/* ─── PANEL SELECT ACTION BAR ─── */
.panel-select-bar{padding:10px 12px;border-top:1px solid var(--border);display:none;align-items:center;gap:8px;flex-shrink:0;background:var(--card);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.panel-select-bar.show{display:flex}
.btn-dl-selected{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;white-space:nowrap}
.btn-dl-selected svg{width:14px;height:14px;stroke:var(--blk-text);fill:none;flex-shrink:0}
.btn-dl-selected:disabled{opacity:.45;cursor:default}
.btn-dl-selected:not(:disabled):hover{background:var(--blk-h)}

/* ─── SEARCH PAGE ─── */
.search-page-hdr{padding:6px 16px 10px;flex-shrink:0;background:transparent;z-index:5}
.search-page-bar{display:flex;gap:8px;align-items:center}
.search-wrap-page{position:relative;flex:1;display:flex;align-items:center}
.search-page-icon{position:absolute;left:14px;width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:2;pointer-events:none}
.search-input-page{width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid rgba(0,0,0,.07);border-radius:99px;font-family:inherit;font-size:14px;color:var(--fg);padding:11px 38px 11px 38px;outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:-.005em;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.search-input-page:focus{border-color:var(--org-text);box-shadow:0 0 0 3px var(--org-s)}
.search-input-page::placeholder{color:var(--sub)}
.btn-clear-input-page{position:absolute;right:10px;width:30px;height:30px;border:none;background:rgba(0,0,0,.06);cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;border-radius:50%;-webkit-tap-highlight-color:transparent}
.btn-clear-input-page:hover{color:var(--fg);background:var(--border)}
.btn-clear-input-page svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.btn-search-page{padding:11px 22px;background:var(--blk);color:var(--blk-text);border:none;border-radius:99px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:-.005em;transition:transform .15s,box-shadow .25s;white-space:nowrap;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 14px -4px rgba(60,50,30,.2)}
.btn-search-page:hover{transform:translateY(-1px);box-shadow:0 8px 22px -6px rgba(60,50,30,.3)}
.btn-search-page:active{transform:translateY(0)}
.search-genres-section{padding:16px 16px 24px}
.search-genres-kicker{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-.01em;margin-bottom:12px}
/* Search context title */
.search-ctx-title{padding:14px 16px 6px;font-size:20px;font-weight:800;color:var(--fg);letter-spacing:-.025em;flex-shrink:0}
.search-genres-section.hidden{display:none}
/* Recent searches */
.recent-searches-wrap{padding:14px 16px 2px;flex-shrink:0}
.recent-searches-wrap.hidden{display:none}
.recent-searches-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.recent-searches-lbl{font-size:13px;font-weight:800;color:#0a0a0a;letter-spacing:.05em;text-transform:uppercase}
.recent-searches-clear{font-size:11px;font-weight:600;color:var(--sub);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;-webkit-tap-highlight-color:transparent;transition:color .15s}
.recent-searches-clear:hover{color:var(--fg)}
.recent-searches-chips{display:flex;flex-wrap:wrap;gap:8px}
.recent-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 12px;background:#0a0a0a;border:1px solid #0a0a0a;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600;color:#fff;-webkit-tap-highlight-color:transparent;transition:opacity .14s;max-width:220px}
.recent-chip:hover{opacity:.8}
.recent-chip svg{width:12px;height:12px;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;flex-shrink:0}
.recent-chip-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-chip-rm{width:16px;height:16px;border:none;background:none;cursor:pointer;color:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:color .14s;margin-left:2px}
.recent-chip-rm:hover{color:#fff}
.recent-chip-rm svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
/* Autocomplete popup */
.ac-popup{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 48px -8px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.07);z-index:99999;overflow:hidden;display:none;flex-direction:column;min-width:280px}
.ac-popup.show{display:flex;animation:ac-in .11s ease-out}
@keyframes ac-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.ac-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background .08s;-webkit-tap-highlight-color:transparent;border:none;width:100%;background:none;font-family:inherit;text-align:left}
.ac-item:hover,.ac-item.ac-focused{background:var(--surf)}
.ac-item+.ac-item{border-top:1px solid rgba(0,0,0,.04)}
.ac-cover-wrap{width:36px;height:52px;border-radius:5px;overflow:hidden;flex-shrink:0;background:var(--surf)}
.ac-cover{width:100%;height:100%;object-fit:cover;display:block}
.ac-cover-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.ac-cover-ph svg{width:16px;height:16px;stroke:#ccc;fill:none}
.ac-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ac-title{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;line-height:1.2}
.ac-meta{display:flex;align-items:center;gap:6px}
.ac-status{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.03em;text-transform:capitalize;flex-shrink:0}
.ac-rating{font-size:11px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:2px}
.ac-rating svg{width:10px;height:10px;flex-shrink:0}
.ac-empty{padding:16px;font-size:13px;color:var(--sub);text-align:center}

/* ─── HERO BANNER (responsive) ─── */
/* Mobile: side margins + rounded card, extends UP behind topbar via negative top margin */
.hero-desktop{position:relative;margin:0 0 20px;height:280px;overflow:hidden;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
.hd-slide{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.hd-slide.active{visibility:visible;pointer-events:auto}
.hd-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(1.05) saturate(.85);transform:scale(1.02)}
.hd-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.55) 55%,rgba(255,255,255,.15) 100%);pointer-events:none}
.hd-content{position:relative;height:100%;display:flex;align-items:flex-start;gap:16px;padding:52px 16px 18px;z-index:2}
.hd-thumb-wrap{flex-shrink:0;width:128px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 14px 32px -8px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.15)}
.hd-thumb{width:100%;height:100%;object-fit:cover;display:block}
.hd-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-width:100%}
.hd-kicker{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:#0a0a0a;letter-spacing:.03em;opacity:.7}
.hd-title{font-family:'Inter',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15;color:#0a0a0a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'Inter',sans-serif;font-size:13px;color:#0a0a0a;font-weight:600}
.hd-rating{display:inline-flex;align-items:center;gap:3px}
.hd-rating .stars{display:inline-flex;gap:1px}

<script>
// ═══════════════════════════════════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════════════════════════════════
const IDB = {
  db: null,
  async init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('manga-dl', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('manga')) db.createObjectStore('manga', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
      };
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _s(s, m) { return this.db.transaction(s, m).objectStore(s); },
  save(b) { return new Promise((res, rej) => { const r = this._s('manga', 'readwrite').put(b); r.onsuccess = res; r.onerror = e => rej(e.target.error); }); },
  getAll() { return new Promise((res, rej) => { const r = this._s('manga', 'readonly').getAll(); r.onsuccess = e => res(e.target.result || []); r.onerror = e => rej(e.target.error); }); },
  get(id) { return new Promise((res, rej) => { const r = this._s('manga', 'readonly').get(id); r.onsuccess = e => res(e.target.result || null); r.onerror = e => rej(e.target.error); }); },
  del(id) { return new Promise((res, rej) => { const r = this._s('manga', 'readwrite').delete(id); r.onsuccess = res; r.onerror = e => rej(e.target.error); }); },
};

// ═══════════════════════════════════════════════════════════════════
// Utils
// ═══════════════════════════════════════════════════════════════════
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function proxyUrl(url, referer) {
  let u = `/api/proxy?url=${encodeURIComponent(url)}`;
  if (referer) u += `&referer=${encodeURIComponent(referer)}`;
  return u;
}
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), dur);
}
function isMob() { return window.innerWidth <= 700; }
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  const months = Math.floor(days / 30.44);
  if (months < 12) return `${months}mo ago`;
  return `${Math.floor(months / 12)}y ago`;
}
const _LANG_COUNTRY = {en:'gb','en-us':'us',ja:'jp',ko:'kr',zh:'cn','zh-hk':'hk','zh-ro':'cn',fr:'fr',es:'es','es-la':'mx','es-419':'mx',pt:'pt','pt-br':'br',de:'de',it:'it',ru:'ru',ar:'sa',tr:'tr',id:'id',vi:'vn',th:'th',pl:'pl',uk:'ua',nl:'nl',ro:'ro',sv:'se',hu:'hu',cs:'cz',bg:'bg',he:'il',fa:'ir',ms:'my',fil:'ph',mn:'mn'};
function langFlag(code) {
  const cc = _LANG_COUNTRY[(code||'').toLowerCase()];
  return cc
    ? `<img src="https://flagcdn.com/16x12/${cc}.png" width="16" height="12" alt="${cc.toUpperCase()}">`
    : `<span style="font-size:9px;font-weight:700;color:var(--sub)">${(code||'??').slice(0,2).toUpperCase()}</span>`;
}
function toggleChGroup(id) { document.getElementById(id)?.classList.toggle('collapsed'); }
function statusPillClass(s) {
  return { ongoing: 'pill-ongoing', completed: 'pill-completed', hiatus: 'pill-hiatus', cancelled: 'pill-cancelled' }[s] || 'pill-ongoing';
}

// rating: 0–10 bayesian score → 5 stars
function starsHtml(rating, cls = '') {
  if (!rating) return '';
  const out5 = rating / 2; // convert to 5-star
  let html = '<span class="stars' + (cls ? ' ' + cls : '') + '">';
  for (let i = 1; i <= 5; i++) {
    if (out5 >= i) html += '<span class="star on">★</span>';
    else if (out5 >= i - 0.5) html += '<span class="star half">★</span>';
    else html += '<span class="star">★</span>';
  }
  html += '</span>';
  return html;
}
function ratingRowHtml(rating, wrapCls = 'star-row') {
  if (!rating) return '';
  return `<div class="${wrapCls}">${starsHtml(rating)}<span class="star-num">${rating.toFixed(1)}</span></div>`;
}

const _acCache = new Map();

function scheduleAc(q, src) {
  clearTimeout(_acTimer);
  if (!q || q.length < 2) { closeAc(src); return; }
  _acTimer = setTimeout(() => fetchAc(q, src), 160);
}
async function fetchAc(q, src) {
  const key = q.toLowerCase();
  const cached = _acCache.get(key);
  if (cached) { renderAc(cached, src); return; }
  if (_acAbort) _acAbort.abort();
  _acAbort = new AbortController();
  try {
    const res = await fetch(`/api/search?limit=6&offset=0&q=${encodeURIComponent(q)}`, { signal: _acAbort.signal });
    const data = await res.json();
    const results = data.results || [];
    _acCache.set(key, results);
    if (_acCache.size > 50) _acCache.delete(_acCache.keys().next().value);
    renderAc(results, src);
  } catch(e) { if (e.name !== 'AbortError') closeAc(src); }
}
function renderAc(results, src) {
  _acFocusIdx = -1;
  const pop = document.getElementById(src === 'desktop' ? 'ac-popup-desktop' : 'ac-popup-main');
  if (!pop) return;
  if (!results.length) {
    pop.innerHTML = `<div class="ac-empty">No results found</div>`;
    pop.classList.add('show'); return;
  }
  const srcKey = src === 'desktop' ? 'desktop' : 'main';
  pop.innerHTML = results.map(r => {
    const pillCls = statusPillClass(r.status);
    const covHtml = r.coverUrl
      ? `<img class="ac-cover" src="${esc(proxyUrl(r.coverUrl, r.coverReferer))}" loading="eager" onerror="this.style.display='none'">`
      : `<div class="ac-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;
    const ratingHtml = r.rating
      ? `<span class="ac-rating"><svg viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${r.rating.toFixed(1)}</span>`
      : '';
    const statusHtml = r.status ? `<span class="ac-status ${pillCls}">${esc(r.status)}</span>` : '';
    return `<button class="ac-item" onmousedown="event.preventDefault()" onclick="selectAcItem('${esc(r.id)}','${srcKey}')">
      <div class="ac-cover-wrap">${covHtml}</div>

  }).join('');
  pop.classList.add('show');
}
function closeAc(src) {
  clearTimeout(_acTimer);
  _acFocusIdx = -1;
  const ids = src ? [(src === 'desktop' ? 'ac-popup-desktop' : 'ac-popup-main')] : ['ac-popup-main','ac-popup-desktop'];
  ids.forEach(id => document.getElementById(id)?.classList.remove('show'));
}
function selectAcItem(id, src) {

function acKeyNav(e, src) {
  const pop = document.getElementById(src === 'desktop' ? 'ac-popup-desktop' : 'ac-popup-main');
  if (!pop?.classList.contains('show')) return;
  const items = [...pop.querySelectorAll('.ac-item')];
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acFocusIdx = Math.min(_acFocusIdx + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acFocusIdx = Math.max(_acFocusIdx - 1, 0);
  } else if (e.key === 'Escape') {
    e.preventDefault(); closeAc(src); return;
  } else if (e.key === 'Enter' && _acFocusIdx >= 0) {
    e.preventDefault(); items[_acFocusIdx].click(); return;
  } else return;
  items.forEach((el, i) => el.classList.toggle('ac-focused', i === _acFocusIdx));
}

// Manga data cache — populated by prefetch + openPanel
const _mangaCache = {};

// Fire-and-forget prefetch on hover/touch. Caches the manga data so click is instant.
function prefetchManga(id, source) {
  const key = (source || 'mdex') + ':' + id;
  if (_mangaCache[key]) return;
  _mangaCache[key] = 'pending';
  const url =
    source === 'mp'   ? `/api/mangaplus?action=manga&id=${encodeURIComponent(id)}` :
    source === 'bato' ? `/api/bato?action=manga&id=${encodeURIComponent(id)}` :
    `/api/manga?id=${id}`;
  fetch(url).then(r => r.json()).then(data => {
    if (!data.error) _mangaCache[key] = data;
    else delete _mangaCache[key];
    // Also warm chapter covers
    if (data?.manga?.coverUrl) {
      const img = new Image();
      img.src = proxyUrl(data.manga.coverUrl, data.manga.coverReferer);
    }
  }).catch(() => { delete _mangaCache[key]; });
}

async function openPanel(id, source) {
  source = source || 'mdex';
  _panelSource = source;
  currentMangaData = null;
  selectMode = false; selectedChIds.clear();
  _prevRoute = _currentRoute;
  navigate('detail', { pushState: false });
  const panel = document.getElementById('panel');
  if (panel) panel.scrollTop = 0;
  const panelBody = document.getElementById('panel-body');
  if (panelBody) panelBody.scrollTop = 0;

  const preview = _previewCache[id];
  if (preview) {
    const pillCls = statusPillClass(preview.status);
    const covHtml = preview.coverUrl
      ? `<img class="panel-cover" src="${esc(proxyUrl(preview.coverUrl, preview.coverReferer))}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="panel-cover-ph" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`
      : `<div class="panel-cover-ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`;
    const tagsHtml = (preview.tags || []).slice(0,4).map(t => `<span class="tag-pill">${esc(t.name || t)}</span>`).join('');
    document.getElementById('panel-hdr').innerHTML = `
      ${covHtml}

        <div class="panel-title">${esc(preview.title)}</div>
        <div class="panel-meta"><span class="status-pill ${pillCls}" style="position:static;display:inline-block;margin-bottom:4px">${esc(preview.status)}</span>${preview.year ? ' · ' + preview.year : ''}</div>
        ${preview.rating ? `<div class="panel-rating">${starsHtml(preview.rating)}<span class="star-num">${preview.rating.toFixed(1)}/10</span></div>` : ''}

    document.getElementById('panel-body').innerHTML = '';
  }

  try {
    const cacheKey = source + ':' + id;
    let data;
    // Use cached prefetch if available and complete
    if (_mangaCache[cacheKey] && _mangaCache[cacheKey] !== 'pending') {
      data = _mangaCache[cacheKey];

      const apiUrl =
        source === 'mp'   ? `/api/mangaplus?action=manga&id=${encodeURIComponent(id)}` :

        `/api/manga?id=${id}`;
      data = await fetch(apiUrl).then(r => r.json());
      if (!data.error) _mangaCache[cacheKey] = data;
    }
    if (data.error) throw new Error(data.error);
    currentMangaData = data;
    renderPanel(data);
  } catch (e) {
    document.getElementById('panel-hdr').innerHTML = `<div style="padding:20px;color:var(--err);font-weight:700">Error: ${esc(e.message)}</div>`;
  }
}

function positionDropdown() {

function renderDropdownItems(results, meta) {
  const dd = document.getElementById('search-dropdown');
  positionDropdown();
  results.forEach(r => { _previewCache[r.id] = r; });

  let html = '';
  // Source label kicker
  if (meta?.sourceName) {
    html += `<div class="sdrop-search-label">${esc(meta.sourceName)} — ${results.length} result${results.length===1?'':'s'}</div>`;
  }
  if (!results.length) {
    if (meta?.hasMore) {
      html += `<div class="sdrop-empty">No results in ${esc(meta.sourceName)}.<br><button class="sdrop-empty-btn" onclick="loadNextSource('${esc(meta.q).replace(/'/g,"\\'")}',${meta.sourceIdx+1})">Search next source →</button></div>`;
    } else {
      html += '<div class="sdrop-empty">No results</div>';
    }
  } else {
    html += results.map(renderDropItem).join('');
    if (meta?.hasMore) {
      html += moreSourcesBtnHtml(meta.q, meta.sourceIdx + 1);
    }
  }
  dd.innerHTML = html;
  dd.classList.add('open');
}

async function doPredict() {
  const q = document.getElementById('search-input').value.trim();
  if (!q.length) { closeDropdown(); return; }
  const dd = document.getElementById('search-dropdown');

  // Instant cache hit — exact match (keyed by source too)
  const cacheKey = _searchSource + '|' + q + '|' + activeTagId;
  if (_dropCache[cacheKey]) { renderDropdownItems(_dropCache[cacheKey]); return; }

  // Partial cache — prefix match (same source only)
  let showed = false;
  for (const key of Object.keys(_dropCache)) {
    const [src, cachedQ] = key.split('|');
    if (src === _searchSource && q.startsWith(cachedQ) && _dropCache[key].length) {
      const filtered = _dropCache[key].filter(r => r.title.toLowerCase().includes(q.toLowerCase()));
      if (filtered.length) { renderDropdownItems(filtered); showed = true; break; }
    }
  }
  if (!showed) {
    const skelRow = `<div class="sdrop-skel">
      <div class="sdrop-skel-cover"></div>
      <div class="sdrop-skel-lines">
        <div class="sdrop-skel-line"></div>
        <div class="sdrop-skel-line short"></div>
        <div class="sdrop-skel-line tiny"></div>
      </div>
    </div>`;
    dd.innerHTML = `<div class="sdrop-search-label">Searching "${esc(q)}"</div>
      <div class="sdrop-loading">${skelRow.repeat(4)}</div>`;
    positionDropdown();
    dd.classList.add('open');
  }

  // Cancel previous in-flight, fetch fresh
  if (_predictCtrl) _predictCtrl.abort();
  _predictCtrl = new AbortController();
  const signal = _predictCtrl.signal;
  try {
    let url;
    if (_searchSource === 'alt') {
      url = `/api/search?q=${encodeURIComponent(q)}&limit=8`;
    } else {
      url = `/api/search?q=${encodeURIComponent(q)}&limit=8`;
      if (activeTagId) url += `&tagId=${activeTagId}`;
    }
    const resp = await fetch(url, { signal });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    _dropCache[cacheKey] = results;
    _dropMeta[cacheKey] = { sourceName: data.sourceName, sourceIdx: data.sourceIdx, hasMore: data.hasMore, q };
    renderDropdownItems(results, _dropMeta[cacheKey]);
  } catch (e) {
    if (e.name === 'AbortError') return;
    dd.innerHTML = `<div class="sdrop-empty">Error: ${esc(e.message)}</div>`;
  }
}

// Load next source results, append to dropdown
async function loadNextSource(q, nextIdx) {
  const dd = document.getElementById('search-dropdown');
  const footer = document.getElementById('sdrop-more-btn');
  if (footer) footer.textContent = 'Searching…';
  try {
    const data = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=8`).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const newItems = data.results || [];
    newItems.forEach(r => { _previewCache[r.id] = r; });
    // Build new HTML for these items + remove old footer
    const labelHtml = `<div class="sdrop-search-label">${esc(data.sourceName)} — ${newItems.length} result${newItems.length===1?'':'s'}</div>`;
    const itemsHtml = newItems.map(r => renderDropItem(r)).join('');
    if (footer) footer.remove();
    dd.insertAdjacentHTML('beforeend', labelHtml + itemsHtml);
    if (data.hasMore) {
      dd.insertAdjacentHTML('beforeend', moreSourcesBtnHtml(q, data.sourceIdx + 1));
    }
  } catch (e) {
    if (footer) footer.textContent = 'Error — tap to retry';
  }
}
