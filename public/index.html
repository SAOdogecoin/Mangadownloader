async function doSearch() {
  closeAc('main');
  document.getElementById('search-input').blur();
  const q = document.getElementById('search-input').value.trim();
  if (!q && !activeTagId && !activeStatus) return;
  if (q) saveRecentSearch(q);
  // Set title before navigate so reset doesn't wipe it
  const genreName = activeTagId ? (GENRES.find(g => g.id === activeTagId)?.name || '') : '';
  const titleText = q || genreName || (activeStatus ? activeStatus.charAt(0).toUpperCase() + activeStatus.slice(1) : 'Search');
  lastQuery = q;
  lastTagId = activeTagId;
  lastStatus = activeStatus;
  lastSort = ''; lastSince = ''; lastOffset = 0;
  _loadingMore = false; _hasMore = true;
  if (_sentinelObs) { _sentinelObs.disconnect(); _sentinelObs = null; }
  if (_currentRoute !== 'search') navigate('search');
  setSearchTitle(titleText);
  document.getElementById('search-genres-section')?.classList.add('hidden');
  document.getElementById('recent-searches-wrap')?.classList.add('hidden');
  document.getElementById('search-loading').style.display = 'flex';
  document.getElementById('results-grid').innerHTML = '';
  document.getElementById('load-more-wrap').style.display = 'none';
  try {
    const url = `/api/search?limit=${SEARCH_LIMIT}&offset=0&q=${encodeURIComponent(q)}${activeTagId ? '&tagId=' + activeTagId : ''}${activeStatus ? '&status=' + activeStatus : ''}`;
    const data = await fetch(url).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    lastOffset = results.length;
    _hasMore = results.length >= SEARCH_LIMIT;
    renderResults(results, false);
    if (_hasMore) _initSentinel();
  } catch (e) {
    showToast('Search failed: ' + e.message);
  } finally {
    document.getElementById('search-loading').style.display = 'none';
  }
}

async function loadMore() {
  if (_loadingMore || !_hasMore) return;
  if (!lastQuery && !lastTagId && !lastSort) return;
  _loadingMore = true;
  document.getElementById('load-more-wrap').style.display = 'block';
  try {
    let url = `/api/search?limit=${SEARCH_LIMIT}&offset=${lastOffset}`;
    if (lastQuery) url += `&q=${encodeURIComponent(lastQuery)}`;
    if (lastTagId) url += `&tagId=${lastTagId}`;
    if (lastStatus) url += `&status=${lastStatus}`;
    if (lastSort) url += `&sort=${encodeURIComponent(lastSort)}`;
    if (lastSince) url += `&since=${encodeURIComponent(lastSince)}`;
    const data = await fetch(url).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    if (results.length) {
      lastOffset += results.length;
      _hasMore = results.length >= SEARCH_LIMIT;
      renderResults(results, true);
    } else {
      _hasMore = false;
    }
  } catch (e) {
    showToast('Load more failed: ' + e.message);
  } finally {
    _loadingMore = false;
    if (!_hasMore) {
      document.getElementById('load-more-wrap').style.display = 'none';
      if (_sentinelObs) { _sentinelObs.disconnect(); _sentinelObs = null; }
    }
  }
}

function navigate(route, { pushState = true } = {}) {
  // Legacy redirect: genres → search (merged)
  if (route === 'genres') route = 'search';
  const prev = _currentRoute;
  // When leaving search, mark for reset on return
  if (prev === 'search' && route !== 'search' && route !== 'detail') _resetSearchOnReturn = true;
  _currentRoute = route;

  if (route === 'detail') {
    // Full-page detail view — just set data-route, CSS handles the rest
    if (route !== 'home') document.body.classList.remove('home-scrolled');
    document.querySelector('.topbar').classList.remove('topbar-scrolled');
    document.body.dataset.route = route;
    return;
  }

  const viewMap = { home: 'v-home', library: 'v-library', search: 'v-search' };
  const viewId = viewMap[route] || 'v-home';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === viewId));
  document.querySelectorAll('.bnav-tab,.desktop-nav-list button,.topbar-desktop-nav button[data-route]').forEach(p => p.classList.toggle('active', p.dataset.route === route));
  if (route !== 'home') document.body.classList.remove('home-scrolled');
  document.querySelector('.topbar').classList.remove('topbar-scrolled');
  document.body.dataset.route = route;
  if (pushState) history.pushState(null, '', '#' + route);
  if (route === 'library') renderLibraryPage();
  if (route === 'search') {
    renderGenrePage();
    // Auto-reset when returning to search from another page
    if (_resetSearchOnReturn) { _resetSearchOnReturn = false; clearSearchAndReset(); }
  }
  if (route === 'home') loadDiscoverySections();
}

function renderContinueReading() {
  const wrap = document.getElementById('cr-wrap');
  if (!wrap) return;
  // Merge read-history (covers non-library reads) with library entries
  const hist = getReadHistory();
  const merged = {};
  Object.values(hist).forEach(h => { merged[h.id] = h; });
  allManga.forEach(m => {
    if (m.lastReadChapterId) {
      merged[m.id] = {
        id: m.id,
        title: m.title,
        coverUrl: m.coverUrl,
        coverReferer: m.coverReferer,
        source: m.source || 'mdex',
        lastReadChapterId: m.lastReadChapterId,
        lastReadChapter: m.lastReadChapter,
        lastReadAt: m.lastReadAt || merged[m.id]?.lastReadAt || 0
      };
    }
  });
  const recent = Object.values(merged)
    .filter(m => m.lastReadChapterId)
    .sort((a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0))
    .slice(0, 12);
  if (!recent.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="home-section">
    <div class="home-section-head"><div class="home-section-label">Continue Reading</div></div>
    <div class="disc-strip">${recent.map(crCardHtml).join('')}</div>
  </div>`;
  // CR items resume reader at saved chapter+page
  wrap.querySelectorAll('.disc-card').forEach(el => {
    const m = recent.find(x => x.id === el.dataset.id);
    el.addEventListener('click', async () => {
      if (!m?.lastReadChapterId) { openPanel(el.dataset.id); return; }
      // Fetch fresh manga data for chapter list (so next-chapter nav works)
      try {
        const src = m.source === 'mp' ? 'mp' : m.source === 'bato' ? 'bato' : 'mdex';
        const apiUrl =
          src === 'mp'   ? `/api/mangaplus?action=manga&id=${encodeURIComponent(m.id)}` :
          src === 'bato' ? `/api/bato?action=manga&id=${encodeURIComponent(m.id)}` :
          `/api/manga?id=${m.id}`;
        const data = await fetch(apiUrl).then(r => r.json());
        if (data && !data.error) currentMangaData = data;
        else currentMangaData = { manga: m, chapters: [] };
      } catch { currentMangaData = { manga: m, chapters: [] }; }
      startRead(m.id, m.lastReadChapterId, m.lastReadChapter || '', '');
    });
  });
}

function renderReadingStats(container) {
  const saved = allManga;

  const totalManga = saved.length;
  const totalChapters = Math.round(saved.reduce((s, m) => s + (parseFloat(m.lastReadChapter || 0) || 0), 0));

  const oldest = saved.reduce((min, m) => m.addedAt && m.addedAt < min ? m.addedAt : min, Date.now());

// View-all → navigate to search view, run filtered fetch using the section's sort key
function _initSentinel() {
  if (_sentinelObs) _sentinelObs.disconnect();
  const sentinel = document.getElementById('results-sentinel');
  if (!sentinel) return;
  // root must be the actual scroll container (#search-body), not the viewport
  const scroller = document.getElementById('search-body');
  _sentinelObs = new IntersectionObserver(([e]) => {
    if (e.isIntersecting) loadMore();
  }, { root: scroller, rootMargin: '300px' });
  _sentinelObs.observe(sentinel);
}

async function viewAllSection(sortKey, label) {
  // Hide genres/recent BEFORE navigate so clearSearchAndReset doesn't re-show them
  document.getElementById('search-genres-section')?.classList.add('hidden');
  document.getElementById('recent-searches-wrap')?.classList.add('hidden');
  if (_currentRoute !== 'search') navigate('search');
  setSearchTitle(label);
  // Reset state
  lastQuery = ''; lastTagId = ''; lastStatus = ''; lastSort = ''; lastSince = ''; lastOffset = 0;
  _loadingMore = false; _hasMore = true;
  if (_sentinelObs) { _sentinelObs.disconnect(); _sentinelObs = null; }
  document.getElementById('search-genres-section')?.classList.add('hidden');
  document.getElementById('search-loading').style.display = 'flex';
  document.getElementById('results-grid').innerHTML = '';
  document.getElementById('load-more-wrap').style.display = 'none';

  // Build initial URL (40 items to fill screen)
  let url = `/api/search?limit=${VIEWALL_INITIAL}&offset=0`;
  if (sortKey === 'selfPublished') {
    url += '&tagId=891cf039-b895-47f0-9229-bef4c96eccd4&sort=followedCount';
    lastTagId = '891cf039-b895-47f0-9229-bef4c96eccd4';
    lastSort = 'followedCount';
  } else if (sortKey === 'seasonal') {
    const m = new Date().getUTCMonth() + 1, y = new Date().getUTCFullYear();
    const start = m>=3&&m<=5?`${y}-03-01T00:00:00`:m>=6&&m<=8?`${y}-06-01T00:00:00`:m>=9&&m<=11?`${y}-09-01T00:00:00`:`${y}-12-01T00:00:00`;
    url += `&since=${encodeURIComponent(start)}&sort=followedCount`;
    lastSort = 'followedCount'; lastSince = start;
  } else {
    url += `&sort=${encodeURIComponent(sortKey)}`;
    lastSort = sortKey;
  }
  try {
    // Use preload cache if available (instant render)
    const cached = _viewAllCache.get(url);
    const data = cached || await fetch(url).then(r => r.json());
    if (!cached) _viewAllCache.set(url, data);
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    lastOffset = results.length;
    _hasMore = results.length >= VIEWALL_INITIAL;
    renderResults(results, false);
    const tb = document.getElementById('topbar-search-input');
    if (tb) tb.placeholder = `Browsing: ${label}`;
    if (_hasMore) _initSentinel();
  } catch (e) {
    showToast('Failed: ' + e.message);
  } finally {
    document.getElementById('search-loading').style.display = 'none';
  }
}

const HOME_CACHE_TTL = 60 * 60 * 1000; // 60 min — generous, background refresh keeps it warm
let _homeCache = null;

function getHomeCache() {
  if (_homeCache && Date.now() - _homeCache.ts < HOME_CACHE_TTL) return _homeCache.data;
  // Try sessionStorage first (fast), then localStorage (survives tabs/sessions)
  for (const store of [sessionStorage, localStorage]) {
    try {
      const raw = store.getItem('homeCache_mdex2');
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Date.now() - parsed.ts < HOME_CACHE_TTL) { _homeCache = parsed; return parsed.data; }
      }
    } catch (_) {}
  }
  return null;
}

function setHomeCache(data) {
  _homeCache = { data, ts: Date.now() };
  const serialized = JSON.stringify(_homeCache);
  try { sessionStorage.setItem('homeCache_mdex2', serialized); } catch (_) {}
  try { localStorage.setItem('homeCache_mdex2', serialized); } catch (_) {}
}

function renderHomeData(data, wrap) {
  wrap.innerHTML = '';
  _sectionIdx = 0;
  const hasAny = (data.trending?.length || data.topRated?.length || data.newManga?.length || data.updated?.length);
  if (!hasAny) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="ekicker">Loading…</div>
      <div class="ekao">(˘･_･˘)</div>
      <div class="etitle">Waking up the <em>archive</em>.</div>
      <div class="esub">If this persists, MangaDex may be down. Try searching for a title directly.</div>
      <button class="ebtn" onclick="navigate('search')">Search Manga</button>
    </div>`;
    return;
  }
  // Hero banner on BOTH mobile + desktop (CSS-responsive)
  const isDesktop = window.innerWidth >= 900;
  const popularNew = data.popularNew || [];
  renderHeroDesktop(popularNew, wrap);
  renderDiscSection('Latest Updates', data.updated, wrap, 'latestUploadedChapter', {showChapter:true});
  if (data.seasonName) renderDiscSection(`Seasonal — ${data.seasonName}`, data.seasonal, wrap, 'seasonal');
  renderDiscSection('Self-Published', data.selfPublished, wrap, 'selfPublished');
  renderDiscSection('Recently Added', data.newManga, wrap, 'createdAt');
  // Preload view-all pages in background so View All is instant
  _preloadViewAllSections(data.seasonName);
}

function _preloadViewAllSections(seasonName) {
  const urls = [
    `/api/search?limit=${VIEWALL_INITIAL}&offset=0&sort=latestUploadedChapter`,
    `/api/search?limit=${VIEWALL_INITIAL}&offset=0&sort=createdAt`,
    `/api/search?limit=${VIEWALL_INITIAL}&offset=0&tagId=891cf039-b895-47f0-9229-bef4c96eccd4&sort=followedCount`,
  ];
  if (seasonName) {
    const m = new Date().getUTCMonth() + 1, y = new Date().getUTCFullYear();
    const start = m>=3&&m<=5?`${y}-03-01T00:00:00`:m>=6&&m<=8?`${y}-06-01T00:00:00`:m>=9&&m<=11?`${y}-09-01T00:00:00`:`${y}-12-01T00:00:00`;
    urls.push(`/api/search?limit=${VIEWALL_INITIAL}&offset=0&since=${encodeURIComponent(start)}&sort=followedCount`);
  }
  // Stagger fetches to avoid hammering API simultaneously
  urls.forEach((url, i) => setTimeout(() => {
    if (_viewAllCache.has(url)) return;
    fetch(url).then(r => r.ok ? r.json() : null).then(d => {
      if (d && !d.error) _viewAllCache.set(url, d);
    }).catch(() => {});
  }, 800 + i * 600)); // start 800ms after home renders, 600ms apart
}

let _hdIdx = 0, _hdLen = 0;
function renderHeroDesktop(items, container) {
  if (!items?.length) return;
  const pick = items.filter(m => m.coverUrl).slice(0, 10);
  if (!pick.length) return;
  _hdLen = pick.length;
  _hdIdx = 0;

  const wrap = document.createElement('div');
  wrap.className = 'hero-desktop';
  wrap.innerHTML = pick.map((it, i) => buildHeroDesktopSlide(it, i)).join('') +
    `<div class="hd-dots">${pick.map((_,i)=>`<button class="hd-dot${i===0?' active':''}" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div>` +
    `<button class="hd-side-arrow" id="hd-side-next" aria-label="Next slide">
       <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
     </button>`;
  container.appendChild(wrap);

  const slides = wrap.querySelectorAll('.hd-slide');
  const dots = wrap.querySelectorAll('.hd-dot');
  function show(i) {
    _hdIdx = (i + _hdLen) % _hdLen;
    slides.forEach((s, k) => s.classList.toggle('active', k === _hdIdx));
    dots.forEach((d, k) => d.classList.toggle('active', k === _hdIdx));
  }
  // Desktop side arrow → next
  document.getElementById('hd-side-next').onclick = e => { e.stopPropagation(); show(_hdIdx + 1); };
  // Dot click → jump
  dots.forEach(d => d.addEventListener('click', e => {
    e.stopPropagation();
    show(parseInt(d.dataset.i, 10));
  }));
  // Mobile swipe
  let touchX = 0;
  wrap.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) show(_hdIdx + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // Click slide → open panel
  wrap.addEventListener('click', e => {
    if (e.target.closest('.hd-dot') || e.target.closest('.hd-side-arrow')) return;
    const a = wrap.querySelector('.hd-slide.active');
    if (a) openPanel(a.dataset.id, a.dataset.source || 'mdex');
  });

  // Prefetch all 5
  pick.forEach(p => {
    prefetchManga(p.id, p.source || 'mdex');
    if (p.coverUrl) { const im = new Image(); im.src = proxyUrl(p.coverUrl, p.coverReferer); }
  });
}

async function loadDiscoverySections({ forceRefresh = false } = {}) {
  const wrap = document.getElementById('discover-wrap');
  if (!wrap) return;
  const cached = getHomeCache();
  if (cached && !forceRefresh) {
    renderHomeData(cached, wrap);
    // silent background refresh — updates cache AND re-renders UI with fresh data
    fetch('/api/home').then(r => r.json()).then(data => {
      setHomeCache(data);
      const w = document.getElementById('discover-wrap');
      if (w) renderHomeData(data, w);
    }).catch(() => {});
    return;
  }
  renderHomeSkeleton(wrap);
  try {
    const data = await fetch('/api/home').then(r => r.json());
    setHomeCache(data);
    renderHomeData(data, wrap);
    // Preload first 6 covers from data for snappy initial paint
    [...(data.trending||[]), ...(data.updated||[])].slice(0,6).forEach(m => {
      if (m.coverUrl) { const img = new Image(); img.src = proxyUrl(m.coverUrl, m.coverReferer); }

    wrap.innerHTML = '';

}

      if (sources.length > 1) {
        // ── Multi-source: tree display ──
        const grpId = `chgrp-${chIdEsc}`;
        const titlePart = ch.title ? ` — ${esc(ch.title)}` : '';
        const sourcesHtml = sources.map(s => {
          const sIdEsc = esc(s.id);
          const isCurSrc = s.id === lastChId;
          const isExt = !!s.externalUrl;
          if (isExt) _extChUrls.set(s.id, s.externalUrl);
          return `<div class="ch-source${isCurSrc ? ' current-ch' : ''}${isExt ? ' is-external' : ''}" data-chid="${sIdEsc}" onclick="handleChRowClick('${sIdEsc}','${mangaIdEsc}','${chNumEsc}','${chTitleEsc}')">
            <div class="ch-tree-col"></div>
            <span class="ch-source-flag">${langFlag(s.translatedLanguage)}<span class="ch-src-num">Ch.${chNumEsc || '?'}</span></span>
            <div class="ch-source-right">
              <span class="ch-source-group">${esc(s.group || 'Unknown group')}${isExt ? ' ' + extBadge : ''}</span>
              <span class="ch-source-time">${[s.publishAt ? timeAgo(s.publishAt) : '', s.pages ? s.pages + 'p' : ''].filter(Boolean).join(' · ')}</span>
            </div>
            <div class="ch-checkbox" id="chk-${sIdEsc}" onclick="event.stopPropagation();toggleChSelect('${sIdEsc}')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          </div>`;
        }).join('');
        return `<div class="ch-group${isCurAny ? ' has-current' : ''}" id="${grpId}">
          <div class="ch-group-hdr" onclick="toggleChGroup('${grpId}')">
            <span class="ch-group-label">${chLabel}${titlePart}</span>
            <span class="ch-group-cnt">${sources.length} sources</span>
            <svg class="ch-group-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="ch-sources-list">${sourcesHtml}</div>
        </div>`;
      } else {
        // ── Single source: augmented row ──
        const isCur = ch.id === lastChId;
        const isExt = !!ch.externalUrl;
        if (isExt) _extChUrls.set(ch.id, ch.externalUrl);
        const flag = langFlag(ch.translatedLanguage);
        const time = timeAgo(ch.publishAt);
        const rightMeta = [ch.group ? `<span class="ch-source-group">${esc(ch.group)}${isExt ? ' ' + extBadge : ''}</span>` : '', time ? `<span class="ch-source-time">${time}</span>` : ''].filter(Boolean).join('');
        return `<div class="ch-row${isCur ? ' current-ch' : ''}${isExt ? ' is-external' : ''}" data-chid="${chIdEsc}" onclick="handleChRowClick('${chIdEsc}','${mangaIdEsc}','${chNumEsc}','${chTitleEsc}')">
          <div class="ch-row-info">
            <div class="ch-num">${flag} ${chLabel}${ch.title ? ` — ${esc(ch.title)}` : ''}</div>
          </div>
          ${rightMeta ? `<div class="ch-row-right">${rightMeta}</div>` : ''}
          <div class="ch-checkbox" id="chk-${chIdEsc}" onclick="event.stopPropagation();toggleChSelect('${chIdEsc}')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        </div>`;
      }
    }).join('');
  }

  if (!chapters.length) {
    chHtml = '<div class="panel-loading"><div class="spin"></div> Searching alt source…</div>';
  }

  document.getElementById('panel-body').innerHTML = chHtml;

  // Auto-search alt source when MangaDex has no chapters
  if (!chapters.length) searchAltForManga(manga.title || '');
  updateSelectBar();

  // Scroll to current chapter (works for both ch-row and ch-source)
  if (lastChId) {
    setTimeout(() => {
      const cur = document.querySelector(`[data-chid="${lastChId}"]`);
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 100);
  }
}

function expandDesc() {

// Start reading from chapter 1 (oldest)
function readFromStart() {
  if (!currentMangaData?.manga || !currentMangaData?.chapters?.length) {
    showToast('Wait for chapters to load');
    return;
  }
  // Internal chapter array is ascending (oldest first) → index 0 = first chapter

// Search alt source by title, show results inline in panel body
async function searchAltForManga(title) {
  document.getElementById('panel-body').innerHTML = '<div class="panel-loading"><div class="spin"></div> Searching alt source…</div>';
  try {
    const data = await fetch(`/api/search?q=${encodeURIComponent(title)}&limit=12`).then(r => r.json());
    if (data.error) throw new Error(data.error);
    const results = data.results || [];
    if (!results.length) {
      document.getElementById('panel-body').innerHTML = '<div style="padding:30px;text-align:center;color:var(--sub);font-size:13px">No results found on alt source.</div>';
      return;
    }
    results.forEach(r => { _previewCache[r.id] = r; });
    document.getElementById('panel-body').innerHTML = `
      <div style="padding:12px 16px 4px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.06em">Alt Source Results</div>
      ${results.map(r => {
        const covSrc = r.coverUrl ? proxyUrl(r.coverUrl, r.coverReferer) : null;
        const img = covSrc ? `<img style="width:42px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0" src="${esc(covSrc)}" onerror="this.style.display='none'">` : '';
        return `<div onclick="closePanel();openPanel('${esc(r.id)}','alt')" style="display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border)">
          ${img}
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--fg)">${esc(r.title)}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:2px">${esc(r.status)}</div>
          </div>
        </div>`;
      }).join('')}`;
  } catch (e) {
    document.getElementById('panel-body').innerHTML = `<div style="padding:30px;text-align:center;color:var(--err);font-size:13px">Error: ${esc(e.message)}</div>`;
  }
}

async function toggleSave() {
  if (!currentMangaData) return;
  const { manga } = currentMangaData;
  const existing = await IDB.get(manga.id);
  if (existing) {
    await IDB.del(manga.id);
    showToast('Removed from library');
  } else {
    await IDB.save({
      id: manga.id,
      title: manga.title,
      coverUrl: manga.coverUrl,
      status: manga.status,
      description: manga.description,
      tags: manga.tags,
      originalLanguage: manga.originalLanguage,
      addedAt: Date.now(),
      lastReadChapterId: null,
      lastReadPage: 0,
      lastReadChapter: null
    });
    showToast('Added to library');
  }
  await loadLibrary();

  const newSaved = await IDB.get(manga.id);

  }
}

// Download
// ═══════════════════════════════════════════════════════════════════
let _dlFormat = 'cbz';

function setDlFormat(fmt) {
  _dlFormat = fmt;
  document.querySelectorAll('.fmt-btn').forEach(b => b.classList.toggle('active', b.dataset.fmt === fmt));
}

async function downloadChapter(chapterId, chapterNum, mangaTitle, btnEl) {
  if (btnEl.classList.contains('dl-loading')) return;
  btnEl.classList.add('dl-loading');
  const fmt = _dlFormat;
  showToast(`Building ${fmt.toUpperCase()}…`, 60000);
  try {
    const url = `/api/download?id=${chapterId}&mangaTitle=${encodeURIComponent(mangaTitle)}&chapterNum=${encodeURIComponent(chapterNum)}&format=${fmt}`;
    const r = await fetch(url);
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || `HTTP ${r.status}`); }
    const buf = await r.arrayBuffer();
    const mime = fmt === 'epub' ? 'application/epub+zip' : 'application/x-cbz';
    const blob = new Blob([buf], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${mangaTitle.replace(/[^\w\s-]/g, '').slice(0, 50)}_Ch${chapterNum || 'x'}.${fmt}`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast(`${fmt.toUpperCase()} downloaded!`);
  } catch (e) {
    showToast('Download failed: ' + e.message);
  } finally {
    btnEl.classList.remove('dl-loading');
  }
}

// Chapter Select Mode
// ═══════════════════════════════════════════════════════════════════
let selectMode = false;
let selectedChIds = new Set();

const _extChUrls = new Map(); // chapterId → externalUrl, populated on panel render

function openExternalChapter(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
}

function handleChRowClick(chId, mangaId, chNum, chTitle) {
  if (selectMode) { toggleChSelect(chId); return; }
  const extUrl = _extChUrls.get(chId);
  if (extUrl) { openExternalChapter(extUrl); return; }
  startRead(mangaId, chId, chNum, chTitle);
}

function toggleSelectMode() {
  selectMode = !selectMode;
  selectedChIds.clear();
  const dlBtn = document.getElementById('panel-dl-btn');
  if (dlBtn) {
    dlBtn.classList.toggle('active', selectMode);
    dlBtn.innerHTML = selectMode
      ? '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancel'
      : '<svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/></svg> Download';
  }
  document.querySelectorAll('.ch-checkbox').forEach(cb => { cb.classList.toggle('visible', selectMode); cb.classList.remove('checked'); });
  const saIcon = document.getElementById('btn-select-all');
  if (saIcon) saIcon.classList.toggle('visible', selectMode);

function toggleChSelect(chId) {
  if (selectedChIds.has(chId)) selectedChIds.delete(chId);
  else selectedChIds.add(chId);
  const cb = document.getElementById('chk-' + chId);
  if (cb) cb.classList.toggle('checked', selectedChIds.has(chId));
  updateSelectBar();
}

function selectAllChapters() {
  const allIds = [...document.querySelectorAll('.ch-checkbox')].map(cb => cb.id.replace('chk-', ''));
  const allSelected = allIds.length > 0 && allIds.every(id => selectedChIds.has(id));
  if (allSelected) {
    selectedChIds.clear();
    document.querySelectorAll('.ch-checkbox').forEach(cb => cb.classList.remove('checked'));
  } else {
    allIds.forEach(id => selectedChIds.add(id));
    document.querySelectorAll('.ch-checkbox').forEach(cb => cb.classList.add('checked'));
  }
  updateSelectBar();
}

function updateSelectBar() {
  const bar = document.getElementById('panel-select-bar');
  const dlBtn = document.getElementById('btn-dl-selected');
  const saBtn = document.getElementById('btn-select-all');
  if (!bar) return;
  bar.classList.toggle('show', selectMode);
  if (dlBtn) { const n = selectedChIds.size; dlBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/></svg>${n ? ` Download ${n}` : ' Download'}`; dlBtn.disabled = n === 0; }
  const saIcon = document.getElementById('btn-select-all');
  if (saIcon && selectMode) {
    const allIds = [...document.querySelectorAll('.ch-checkbox')].map(cb => cb.id.replace('chk-', ''));
    const allChecked = allIds.length > 0 && allIds.every(id => selectedChIds.has(id));
    saIcon.classList.toggle('all-checked', allChecked);
    saIcon.innerHTML = allChecked
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="15.5 13 12 9 8.5 13"/></svg>'
      : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="8.5 11 12 15 15.5 11"/></svg>';
  }
}

async function downloadSelected() {
  if (!selectedChIds.size || !currentMangaData) return;
  const { manga, chapters } = currentMangaData;
  const toDownload = chapters.filter(ch => selectedChIds.has(ch.id));
  if (!toDownload.length) return;
  const dlBtn = document.getElementById('btn-dl-selected');
  if (dlBtn) dlBtn.disabled = true;
  let failed = 0;
  for (let i = 0; i < toDownload.length; i++) {
    const ch = toDownload[i];
    showToast(`Downloading ${i + 1}/${toDownload.length}…`, 60000);
    try {
      const fmt = _dlFormat;
      const url = `/api/download?id=${ch.id}&mangaTitle=${encodeURIComponent(manga.title)}&chapterNum=${encodeURIComponent(ch.chapter || '')}&format=${fmt}`;
      const r = await fetch(url);
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || `HTTP ${r.status}`); }
      const buf = await r.arrayBuffer();
      const mime = fmt === 'epub' ? 'application/epub+zip' : 'application/x-cbz';
      const blob = new Blob([buf], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${manga.title.replace(/[^\w\s-]/g, '').slice(0, 50)}_Ch${ch.chapter || 'x'}.${fmt}`;
      a.click();
      URL.revokeObjectURL(a.href);
      if (i < toDownload.length - 1) await new Promise(res => setTimeout(res, 700));
    } catch (e) {
      failed++;
      showToast(`Ch.${ch.chapter || '?'} failed: ${e.message}`, 3000);
      await new Promise(res => setTimeout(res, 1200));
    }
  }
  const ok = toDownload.length - failed;
  showToast(failed ? `${ok} downloaded, ${failed} failed` : `${ok} chapter${ok > 1 ? 's' : ''} downloaded!`);
  if (dlBtn) { dlBtn.disabled = selectedChIds.size === 0; }
}

// ═══════════════════════════════════════════════════════════════════
// Reader
// ═══════════════════════════════════════════════════════════════════
let readerState = {
  mangaId: null,
  mangaTitle: '',
  chapterId: null,
  chapterNum: '',
  chapterTitle: '',
  pages: [],
  pageIdx: 0,
  isRTL: false,
  isVertical: false,    // webtoon/manhua scroll mode
  chapters: [],         // full chapter list for navigation
  chapterListIdx: 0,    // index in chapters array
  topBarVisible: true,
  topBarTimer: null
};

// Detect long-strip / webtoon / manhua reading mode from manga metadata
function detectVerticalMode(manga) {
  if (!manga) return false;
  // 1. User preference override (per-manga)
  const pref = getReadModePref(manga.id);
  if (pref === 'vertical') return true;
  if (pref === 'horizontal') return false;
  // 2. Auto-detect from tags
  const tags = (manga.tags || []).map(t => (t.name || t || '').toLowerCase()).join(' ');
  if (/long.?strip|webtoon|manhua|manhwa/.test(tags)) return true;
  // 3. Auto-detect from language
  const lang = (manga.originalLanguage || '').toLowerCase();
  if (lang === 'ko' || lang === 'zh' || lang === 'zh-hk') return true;
  // 4. Source = alt (Suwayomi) is mostly webtoons/manhwa → default to vertical
  if (manga.source === 'alt') return true;
  return false;
}

// Per-manga reading mode preference (vertical | horizontal | null=auto)
function getReadModePref(mangaId) {
  try { return localStorage.getItem('readMode_' + mangaId); } catch { return null; }
}
function setReadModePref(mangaId, mode) {
  try { localStorage.setItem('readMode_' + mangaId, mode); } catch {}
}

// SVG icons for mode toggle button
const SVG_MODE_VERT = '<rect x="6" y="3" width="12" height="3" rx="1"/><rect x="6" y="10" width="12" height="3" rx="1"/><rect x="6" y="17" width="12" height="3" rx="1"/>';
const SVG_MODE_HORZ = '<rect x="3" y="6" width="3" height="12" rx="1"/><rect x="10" y="6" width="3" height="12" rx="1"/><rect x="17" y="6" width="3" height="12" rx="1"/>';

function updateModeIcon() {
  const btn = document.getElementById('reader-mode-btn');
  const icon = document.getElementById('reader-mode-icon');
  if (readerState.isVertical) {
    icon.innerHTML = SVG_MODE_VERT;
    btn.classList.add('active');
    btn.title = 'Vertical (webtoon) — tap to switch';
  } else {
    icon.innerHTML = SVG_MODE_HORZ;
    btn.classList.remove('active');
    btn.title = 'Horizontal (pages) — tap to switch';
  }
}

function toggleReadMode() {
  readerState.isVertical = !readerState.isVertical;
  setReadModePref(readerState.mangaId, readerState.isVertical ? 'vertical' : 'horizontal');

  // Toggle classes
  document.getElementById('reader-area').classList.toggle('vertical', readerState.isVertical);
  document.getElementById('reader-overlay').classList.toggle('vmode', readerState.isVertical);
  updateModeIcon();

  // Re-render at current page
  showPage(readerState.pageIdx);
}

async function startRead(mangaId, chapterId, chapterNum, chapterTitle) {
  // Only read saved data — never auto-save. User must click "Add to Library" manually.
  const saved = await IDB.get(mangaId);

  readerState.mangaId = mangaId;
  readerState.mangaTitle = saved?.title || currentMangaData?.manga?.title || '';
  readerState.chapterId = chapterId;
  readerState.chapterNum = chapterNum;
  readerState.chapterTitle = chapterTitle;
  readerState.pages = [];
  readerState.pageIdx = saved?.lastReadChapterId === chapterId ? (saved.lastReadPage || 0) : 0;
  readerState.isRTL = (saved?.originalLanguage || currentMangaData?.manga?.originalLanguage || 'ja') === 'ja';
  readerState.isVertical = detectVerticalMode(currentMangaData?.manga);
  readerState.chapters = currentMangaData?.chapters || [];
  readerState.chapterListIdx = readerState.chapters.findIndex(c => c.id === chapterId);

  // Toggle vertical class on reader-area AND overlay (tap-zones are overlay children)
  document.getElementById('reader-area').classList.toggle('vertical', readerState.isVertical);
  document.getElementById('reader-overlay').classList.toggle('vmode', readerState.isVertical);
  updateModeIcon();
  updateChNav();

  // Show overlay
  document.getElementById('reader-overlay').classList.remove('hidden');
  document.body.classList.add('reader-open');
  document.getElementById('reader-title').textContent = readerState.mangaTitle;
  document.getElementById('reader-ch').textContent = `Ch.${chapterNum}${chapterTitle ? ' — ' + chapterTitle : ''}`;
  showPageLoading();
  autoHideTopBar();
  // Update URL — save pre-reader hash to restore on close
  if (!readerState.prevHash || !location.hash.startsWith('#read/')) {
    readerState.prevHash = location.hash || '#home';
  }
  updateReaderUrl();

  // Fetch pages — detect alt source by chapter ID prefix
  try {
    const pagesUrl =
      chapterId.startsWith('mp:')   ? `/api/mangaplus?action=pages&id=${encodeURIComponent(chapterId)}` :
      chapterId.startsWith('bato:') ? `/api/bato?action=pages&id=${encodeURIComponent(chapterId)}` :
      `/api/pages?id=${chapterId}`;
    const data = await fetch(pagesUrl).then(r => r.json());
    if (data.error) throw new Error(data.error);
    readerState.pages = data.pages || [];
    readerState.pagesFallback = data.pagesFallback || [];
    if (!readerState.pages.length) throw new Error('No pages found');

    // Clamp page idx
    if (readerState.pageIdx >= readerState.pages.length) readerState.pageIdx = 0;
    showPage(readerState.pageIdx);

    // Aspect-ratio sniff: if user has NO preference saved and we're currently horizontal,
    // probe the first image. If it's very tall (webtoon-like), auto-switch to vertical.
    if (!readerState.isVertical && !getReadModePref(readerState.mangaId) && readerState.pages[0]) {
      const probe = new Image();
      probe.onload = () => {
        const ratio = probe.naturalHeight / probe.naturalWidth;
        if (ratio > 2.2) { // webtoon strips are typically 1:3 or taller
          readerState.isVertical = true;
          document.getElementById('reader-area').classList.add('vertical');
          document.getElementById('reader-overlay').classList.add('vmode');
          updateModeIcon();
          showPage(readerState.pageIdx);
        }
      };
      probe.src = proxyUrl(readerState.pages[0]);
    }

    // For horizontal mode: keep aggressive whole-chapter prefetch (small images, fine).
    // For vertical mode: skip — chunk observer in showVertical handles on-demand load.
    if (!readerState.isVertical) {
      setTimeout(() => prefetchAllPages(readerState.pages, readerState.pagesFallback), 250);
    }

    // Prefetch next chapter's page list (not images, just the manifest) for fast chapter swap
    const nextCh = readerState.chapters[readerState.chapterListIdx + 1];
    if (nextCh) {
      const url =
        nextCh.id.startsWith('mp:')   ? `/api/mangaplus?action=pages&id=${encodeURIComponent(nextCh.id)}` :
        nextCh.id.startsWith('bato:') ? `/api/bato?action=pages&id=${encodeURIComponent(nextCh.id)}` :
        `/api/pages?id=${nextCh.id}`;
      setTimeout(() => fetch(url).catch(() => {}), 800);
    }
  } catch (e) {
    // Close reader entirely on failure — don't leave a half-open error screen with the top bar showing
    closeReader();
    showToast(`Failed to load chapter: ${e.message}`, 3500);
  }
}

// Prefetch every page in background. Browser cache will serve them instantly when displayed.
const _prefetched = new Set();
function prefetchAllPages(pages, fallback) {
  if (!pages || !pages.length) return;
  pages.forEach((p, i) => {
    if (!p) return;
    const url = proxyUrl(p);
    if (_prefetched.has(url)) return;
    _prefetched.add(url);
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    // Stagger slightly to avoid burst
  });
  // Also warm fallback for first 5
  (fallback || []).slice(0, 5).forEach(p => {
    if (!p) return;
    const url = proxyUrl(p);
    if (_prefetched.has(url)) return;
    _prefetched.add(url);
    const img = new Image();
    img.src = url;
  });
}

function showPageLoading() {
  document.getElementById('reader-img-wrap').innerHTML = `<div class="reader-page-loading"><div class="reader-spin"></div>Loading page…</div>`;
}

function showPage(idx) {
  const { pages, isRTL, isVertical } = readerState;
  if (!pages.length) return;
  idx = Math.max(0, Math.min(idx, pages.length - 1));
  readerState.pageIdx = idx;

  if (isVertical) return showVertical(idx);

  const url = proxyUrl(pages[idx]); // proxy handles referer inference from hostname
  const wrap = document.getElementById('reader-img-wrap');

  // Show spinner while loading
  wrap.innerHTML = `<div class="reader-page-loading"><div class="reader-spin"></div>Loading…</div>`;

  const img = new Image();
  img.className = 'reader-img';
  img.alt = '';
  img.onload = () => {
    wrap.innerHTML = '';
    wrap.appendChild(img);
  };
  img.onerror = () => {
    const fallback = readerState.pagesFallback?.[idx];
    if (fallback && img.src !== proxyUrl(fallback)) {
      img.src = proxyUrl(fallback);
    } else {
      wrap.innerHTML = `<div class="reader-error">Failed to load page ${idx + 1}</div>`;
    }
  };
  img.src = url;

  // Preload next 5 pages (in addition to background chapter prefetch)
  for (let i = 1; i <= 5; i++) {
    const ni = isRTL ? idx - i : idx + i;
    if (ni >= 0 && ni < pages.length) {
      const preload = new Image();
      preload.decoding = 'async';
      preload.src = proxyUrl(pages[ni]);
    }
  }

  // Update UI
  const total = pages.length;
  document.getElementById('reader-pg-counter').textContent = `${idx + 1} / ${total}`;
  const pct = total > 1 ? (idx / (total - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  updateReaderUrl();
  updateChNav();
  updateNextChBtn();

  // Save progress
  saveProgress(readerState.mangaId, readerState.chapterId, readerState.chapterNum, idx);
}

// ─── Vertical (webtoon/manhua) reader ─────────────────────────────────
let _vertObserver = null;
let _vertChunkObs = null;
async function showVertical(startIdx) {
  const { pages, pagesFallback } = readerState;
  const area = document.getElementById('reader-area');
  const wrap = document.getElementById('reader-img-wrap');
  const total = pages.length;

  // Chunked load — first ~20% eagerly, rest lazy with src set on-demand as user scrolls
  const INITIAL_CHUNK = Math.max(3, Math.ceil(total * 0.2));
  // Quick warm of first 3 pages so render is instant
  const proxied = pages.map(p => proxyUrl(p));
  await Promise.all(proxied.slice(0, 3).map(url => new Promise(r => {
    const img = new Image(); img.decoding = 'async';
    img.onload = img.onerror = () => r();
    img.src = url;
  })));

  // Build stacked DOM. First INITIAL_CHUNK pages get real src (eager load).
  // Rest get data-src — actual src set when IntersectionObserver detects approach.
  const pagesHtml = pages.map((p, i) => {
    const url = esc(proxyUrl(p));
    const fb = pagesFallback?.[i] ? esc(proxyUrl(pagesFallback[i])) : '';
    const srcAttr = i < INITIAL_CHUNK ? `src="${url}"` : `data-src="${url}"`;
    const loading = i < INITIAL_CHUNK ? 'eager' : 'lazy';
    return `<div class="reader-vpage" data-idx="${i}" style="min-height:${i < INITIAL_CHUNK ? 'auto' : '60vh'}">
      <img loading="${loading}" decoding="async" ${srcAttr} alt="" ${fb ? `onerror="if(this.dataset.fb){return}this.dataset.fb=1;this.src='${fb}'"` : ''}>
      <span class="reader-vpage-num">${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span>
    </div>`;
  }).join('');
  const hasNext = readerState.chapterListIdx >= 0 && readerState.chapterListIdx < readerState.chapters.length - 1;
  const endHtml = `<div class="reader-vend">End of chapter${hasNext ? `<br><button onclick="goNextChapter()">Next Chapter</button>` : ''}</div>`;
  wrap.innerHTML = pagesHtml + endHtml;

  // Jump to saved page
  requestAnimationFrame(() => {
    const target = wrap.querySelector(`.reader-vpage[data-idx="${startIdx}"]`);
    if (target && startIdx > 0) target.scrollIntoView({ block: 'start', behavior: 'auto' });
  });

  // Track current page via IntersectionObserver
  if (_vertObserver) _vertObserver.disconnect();
  _vertObserver = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting && e.intersectionRatio > 0.4) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (!isNaN(idx) && idx !== readerState.pageIdx) {
          readerState.pageIdx = idx;
          document.getElementById('reader-pg-counter').textContent = `${idx + 1} / ${total}`;
          const pct = total > 1 ? (idx / (total - 1)) * 100 : 100;
          document.getElementById('progress-fill').style.width = pct + '%';
          updateReaderUrl();
          updateChNav();
          saveProgress(readerState.mangaId, readerState.chapterId, readerState.chapterNum, idx);
        }
      }
    }
  }, { root: area, threshold: [0.4, 0.6] });
  wrap.querySelectorAll('.reader-vpage').forEach(el => _vertObserver.observe(el));

  // Chunked-load observer: when a deferred page comes within 1.5 viewport heights, set its src
  if (_vertChunkObs) _vertChunkObs.disconnect();
  _vertChunkObs = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const img = e.target.querySelector('img[data-src]');
      if (img) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        e.target.style.minHeight = '';
        _vertChunkObs.unobserve(e.target);
      }
    }
  }, { root: area, rootMargin: '150% 0px 150% 0px' });
  wrap.querySelectorAll('.reader-vpage[data-idx]').forEach(el => {
    if (el.querySelector('img[data-src]')) _vertChunkObs.observe(el);
  });

  // Update progress bar initial state
  document.getElementById('reader-pg-counter').textContent = `${startIdx + 1} / ${total}`;
  const pct = total > 1 ? (startIdx / (total - 1)) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  updateReaderUrl();

  // Tap anywhere to toggle top bar in vertical mode
  area.onclick = (e) => {
    if (e.target.closest('button')) return;
    toggleTopBar();
  };
}

async function saveProgress(mangaId, chapterId, chapterNum, pageIdx) {
  // Update library entry if saved
  const saved = await IDB.get(mangaId);
  if (saved) {
    saved.lastReadChapterId = chapterId;
    saved.lastReadPage = pageIdx;
    saved.lastReadChapter = chapterNum;
    saved.lastReadAt = Date.now();
    await IDB.save(saved);
  }
  // Always update read history (works for non-library reads too)
  saveReadHistory(mangaId, chapterId, chapterNum, pageIdx);
}

// Read history: persists progress for ANY manga (library or not) → powers Continue Reading
function saveReadHistory(mangaId, chapterId, chapterNum, pageIdx) {
  try {
    const hist = JSON.parse(localStorage.getItem('readHistory') || '{}');
    const m = currentMangaData?.manga;
    const existing = hist[mangaId] || {};
    hist[mangaId] = {
      id: mangaId,
      title: m?.title || existing.title || 'Untitled',
      coverUrl: m?.coverUrl || existing.coverUrl || null,
      coverReferer: m?.coverReferer || existing.coverReferer || null,
      source: m?.source || existing.source || 'mdex',
      lastReadChapterId: chapterId,
      lastReadChapter: chapterNum,
      lastReadPage: pageIdx,
      lastReadAt: Date.now()
    };
    // Cap history to 30 most-recent entries
    const entries = Object.values(hist).sort((a,b) => (b.lastReadAt||0) - (a.lastReadAt||0)).slice(0, 30);
    const capped = {};
    entries.forEach(e => capped[e.id] = e);
    localStorage.setItem('readHistory', JSON.stringify(capped));
  } catch (e) { console.warn('saveReadHistory failed', e); }
}
function getReadHistory() {
  try { return JSON.parse(localStorage.getItem('readHistory') || '{}'); } catch { return {}; }
}

function pageNav(dir) {
  const { pages, pageIdx, isRTL, isVertical } = readerState;
  if (!pages.length) return;
  if (isVertical) return; // vertical mode uses scroll, not tap/swipe nav
  // RTL: left = next, right = prev
  let next;
  if (dir === 'next') next = isRTL ? pageIdx - 1 : pageIdx + 1;
  else next = isRTL ? pageIdx + 1 : pageIdx - 1;

  if (next < 0 || next >= pages.length) return;
  showPage(next);
  resetTopBarTimer();
}

async function goNextChapter() {
  const { chapters, chapterListIdx, mangaId } = readerState;
  const nextCh = chapters[chapterListIdx + 1];
  if (!nextCh) return;
  const btn = document.getElementById('next-ch-btn');
  if (btn) btn.style.display = 'none';
  await startRead(mangaId, nextCh.id, nextCh.chapter || '', nextCh.title || '');
}

async function goPrevChapter() {
  const { chapters, chapterListIdx, mangaId } = readerState;
  const prevCh = chapters[chapterListIdx - 1];
  if (!prevCh) return;
  await startRead(mangaId, prevCh.id, prevCh.chapter || '', prevCh.title || '');
}

function updateNextChBtn() {
  const { pages, pageIdx, isRTL, chapterListIdx, chapters } = readerState;
  if (!pages.length) return;
  const atEnd = pageIdx === pages.length - 1;
  const hasNext = chapterListIdx >= 0 && chapterListIdx < chapters.length - 1;
  const btn = document.getElementById('next-ch-btn');
  if (btn) {
    btn.style.display = atEnd && hasNext ? 'block' : 'none';
    // Arrow points toward the direction of the next chapter tap zone
    btn.textContent = isRTL ? '← Next Chapter' : 'Next Chapter →';
  }
}

function updateChNav() {
  // pageNav('prev') in RTL increments idx (forward); pageNav('next') decrements (backward)
  // So RTL "Next" button must call pageNav('prev'), and "Prev" must call pageNav('next')
  const { pageIdx, pages, isRTL } = readerState;
  const total = pages.length;
  const leftBtn = document.getElementById('reader-left-btn');
  const rightBtn = document.getElementById('reader-right-btn');
  if (!leftBtn || !total) return;
  if (isRTL) {
    // RTL: ← (left) = forward = pageNav('prev') = increment
    leftBtn.onclick = () => pageNav('prev');
    leftBtn.disabled = pageIdx === total - 1; // can't increment past last
    document.getElementById('left-label').textContent = 'Next';
    document.getElementById('left-arrow').setAttribute('points', '15 18 9 12 15 6'); // ←
    // → (right) = backward = pageNav('next') = decrement
    rightBtn.onclick = () => pageNav('next');
    rightBtn.disabled = pageIdx === 0; // can't decrement below 0
    document.getElementById('right-label').textContent = 'Prev';
    document.getElementById('right-arrow').setAttribute('points', '9 18 15 12 9 6'); // →
  } else {
    // LTR: ← = backward, → = forward
    leftBtn.onclick = () => pageNav('prev');
    leftBtn.disabled = pageIdx === 0;
    document.getElementById('left-label').textContent = 'Prev';
    document.getElementById('left-arrow').setAttribute('points', '15 18 9 12 15 6'); // ←
    rightBtn.onclick = () => pageNav('next');
    rightBtn.disabled = pageIdx === total - 1;
    document.getElementById('right-label').textContent = 'Next';
    document.getElementById('right-arrow').setAttribute('points', '9 18 15 12 9 6'); // →
  }
}

function slugify(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'manga';
}
function updateReaderUrl() {
  const { mangaTitle, chapterNum, pageIdx } = readerState;
  history.replaceState(null, '', `#read/${slugify(mangaTitle)}/${encodeURIComponent(chapterNum || '0')}/${pageIdx + 1}`);
}

function closeReader() {
  document.getElementById('reader-overlay').classList.add('hidden');
  document.body.classList.remove('reader-open');
  document.getElementById('reader-overlay').classList.remove('vmode');
  document.getElementById('reader-img-wrap').innerHTML = '';
  const area = document.getElementById('reader-area');
  area.classList.remove('vertical');
  area.onclick = null;
  if (_vertObserver) { _vertObserver.disconnect(); _vertObserver = null; }
  if (_vertChunkObs) { _vertChunkObs.disconnect(); _vertChunkObs = null; }
  clearTimeout(readerState.topBarTimer);
  const nxBtn = document.getElementById('next-ch-btn');
  if (nxBtn) nxBtn.style.display = 'none';
  document.getElementById('reader-top').classList.remove('hide');
  document.getElementById('reader-bottom-bar').classList.remove('hide');
  history.replaceState(null, '', readerState.prevHash || '#home');
  // Refresh panel chapter highlights
  if (currentMangaData) renderPanel(currentMangaData);
}

function toggleTopBar() {
  const bar = document.getElementById('reader-top');
  readerState.topBarVisible = !readerState.topBarVisible;
  bar.classList.toggle('hide', !readerState.topBarVisible);
  document.getElementById('reader-bottom-bar').classList.toggle('hide', !readerState.topBarVisible);
  if (readerState.topBarVisible) resetTopBarTimer();
}

function autoHideTopBar() {
  readerState.topBarVisible = true;
  document.getElementById('reader-top').classList.remove('hide');
  document.getElementById('reader-bottom-bar').classList.remove('hide');
  resetTopBarTimer();
}

function resetTopBarTimer() {
  clearTimeout(readerState.topBarTimer);
  readerState.topBarTimer = setTimeout(() => {
    document.getElementById('reader-top').classList.add('hide');
    document.getElementById('reader-bottom-bar').classList.add('hide');
    readerState.topBarVisible = false;
  }, 3500);
}

// Swipe detection on reader area
let touchStartX = 0, touchStartY = 0, touchStartT = 0;
document.getElementById('reader-area').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartT = Date.now();
}, { passive: true });
document.getElementById('reader-area').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if (dt < 400 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    pageNav(dx < 0 ? 'next' : 'prev');
  }
}, { passive: true });

// Keyboard support
document.addEventListener('keydown', e => {
  if (document.getElementById('reader-overlay').classList.contains('hidden')) return;
  if (e.key === 'Escape') { if (document.getElementById('toc-panel').classList.contains('open')) closeToc(); else closeReader(); return; }
  if (e.key === 'ArrowRight') pageNav('next');
  if (e.key === 'ArrowLeft') pageNav('prev');
});

// ═══════════════════════════════════════════════════════════════════
// TOC (Chapter list in reader)
// ═══════════════════════════════════════════════════════════════════
function openToc() {
  const { chapters, chapterId, mangaTitle } = readerState;
  if (!chapters.length) return;
  document.getElementById('toc-label').textContent = mangaTitle || 'Chapters';
  const list = document.getElementById('toc-list');
  list.innerHTML = chapters.map((ch, i) => {
    const label = ch.chapter ? `Ch.${ch.chapter}` : `Ch.${i + 1}`;
    const isCur = ch.id === chapterId;
    return `<div class="toc-item${isCur ? ' cur' : ''}" onclick="jumpChapter('${esc(ch.id)}','${esc(ch.chapter||'')}','${esc(ch.title||'')}',${i})">
      <span class="toc-num">${label}</span>
      <span class="toc-name">${esc(ch.title || label)}</span>
      ${ch.pages ? `<span class="toc-pages">${ch.pages}p</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('toc-bg').classList.add('open');
  document.getElementById('toc-panel').classList.add('open');
  setTimeout(() => {
    const cur = list.querySelector('.toc-item.cur');
    if (cur) cur.scrollIntoView({ block: 'center', behavior: 'instant' });
  }, 50);
}

async function jumpChapter(chId, chNum, chTitle, idx) {
  closeToc();
  readerState.chapterListIdx = idx;
  await startRead(readerState.mangaId, chId, chNum, chTitle);
}

function closeToc() {
  document.getElementById('toc-bg').classList.remove('open');
  document.getElementById('toc-panel').classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// Dark mode
// ═══════════════════════════════════════════════════════════════════
function toggleTheme() {}
function updateThemeIcon() {}

// Hash routing
window.addEventListener('hashchange', () => {
  const route = location.hash.replace('#', '') || 'home';
  if (['home','library','search','genres'].includes(route)) navigate(route, { pushState: false });
});

// Search + Library topbar: transparent → white/frosted on scroll
document.getElementById('search-body').addEventListener('scroll', function() {
  document.querySelector('.topbar').classList.toggle('topbar-scrolled', this.scrollTop > 8);
}, { passive: true });
document.getElementById('v-library').addEventListener('scroll', function() {
  document.querySelector('.topbar').classList.toggle('topbar-scrolled', this.scrollTop > 8);
}, { passive: true });

// Reader swipe to turn pages
(function() {
  let _sx = 0, _sy = 0;
  const ro = document.getElementById('reader-overlay');
  ro.addEventListener('touchstart', e => {
    _sx = e.touches[0].clientX;
    _sy = e.touches[0].clientY;
  }, { passive: true });
  ro.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - _sx;
    const dy = e.changedTouches[0].clientY - _sy;
    // Only register horizontal swipes (dx dominates and > 40px threshold)
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      pageNav(dx < 0 ? 'next' : 'prev');
    }
  }, { passive: true });
})();

(async () => {
  await IDB.init();
  await loadLibrary();
  updateThemeIcon();
  renderDesktopSidebarGenres();
  const initialRoute = location.hash.replace('#', '') || 'home';
  navigate(initialRoute, { pushState: false });
  if (!['library','genres','search'].includes(initialRoute)) loadDiscoverySections();
  // Refresh home data every 5 minutes (only when on home tab)
  setInterval(() => {
    if (_currentRoute === 'home') loadDiscoverySections({ forceRefresh: true });
  }, 5 * 60 * 1000);
})();

</script>
